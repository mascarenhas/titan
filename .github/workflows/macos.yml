name: macOS

on:
  workflow_dispatch:

env:
  TITAN_BUILD_PROFILE: validation
  TITAN_ABI_VERSION: "2"

jobs:
  # macOS runners are expensive, so keep the complete cross-platform gate on
  # explicit manual dispatch. It remains independent of Linux preparation: a
  # transient Linux build failure must not suppress a requested macOS run.
  test-macos:
    name: test (macos-latest, macos-full)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua
      # Standard macOS hosted runners expose three CPUs; the parallel native
      # aggregate run keeps the same explicit cap.
      MAKEFLAGS: "-j3"
      TITAN_JOBS: "3"
      TITAN_TEST_JOBS: "3"
      OPENSSL_MODE: bundled
      LIBUV_VERSION: "1.53.0"
      # Bump when any CMake option that affects the cached archive changes.
      LIBUV_BUILD_PROFILE: "static-pic-validation-tests-off-v3"
      LLHTTP_VERSION: "9.4.3"
      LLHTTP_SHA256: "1eb813c7437b31a87496a1cd3ed79f00746720f5e7e29c79b42c02cb69f36c39"
      LLHTTP_BUILD_PROFILE: "static-pic-hidden-c99-v1"
      SQLITE3_VERSION: "3.53.4"
      SQLITE3_RELEASE: "3530400"
      SQLITE3_SHA256: "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"
      SQLITE3_BUILD_PROFILE: "static-pic-hidden-c99-threadsafe1-v1"
      OPENSSL_VERSION: "3.5.7"
      OPENSSL_SHA256: "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"
      OPENSSL_BUILD_PROFILE: "static-pic-hidden-minimal-v1"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      # Reuse dependency rocks; rebuild Lua from the pinned source submodule.
      - name: Cache standalone-prefix LuaRocks dependencies
        uses: actions/cache@v5
        with:
          path: |
            .lua/bin/busted
            .lua/bin/cluacov
            .lua/bin/luacov
            .lua/bin/luarocks
            .lua/bin/luarocks-admin
            .lua/etc/luarocks
            .lua/etc/titan
            .lua/lib/lua/5.5
            .lua/lib/luarocks
            .lua/share/lua/5.5
          key: macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-prefix-stock-luarocks-v3-abi-${{ env.TITAN_ABI_VERSION }}-rocks-3.13.0-${{ hashFiles('titan-0.6.0-1.rockspec') }}
          restore-keys: |
            macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-prefix-stock-luarocks-v3-abi-${{ env.TITAN_ABI_VERSION }}-rocks-3.13.0-

      - name: Cache bundled libuv source and static build
        uses: actions/cache@v5
        with:
          path: |
            libuv-v${{ env.LIBUV_VERSION }}
            libuv-v${{ env.LIBUV_VERSION }}.tar.gz
            libuv-build
          key: macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-libuv-${{ env.LIBUV_VERSION }}-${{ env.LIBUV_BUILD_PROFILE }}-${{ hashFiles('vendor/libuv/*.patch') }}
          restore-keys: |
            macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-libuv-${{ env.LIBUV_VERSION }}-${{ env.LIBUV_BUILD_PROFILE }}-

      - name: Cache bundled llhttp source and static build
        uses: actions/cache@v5
        with:
          path: |
            llhttp-release-v${{ env.LLHTTP_VERSION }}
            llhttp-release-v${{ env.LLHTTP_VERSION }}.tar.gz
            llhttp-build
          key: macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-llhttp-${{ env.LLHTTP_VERSION }}-${{ env.LLHTTP_SHA256 }}-${{ env.LLHTTP_BUILD_PROFILE }}
          restore-keys: |
            macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-llhttp-${{ env.LLHTTP_VERSION }}-${{ env.LLHTTP_SHA256 }}-

      - name: Cache bundled SQLite amalgamation and static build
        uses: actions/cache@v5
        with:
          path: |
            sqlite-autoconf-${{ env.SQLITE3_RELEASE }}
            sqlite-autoconf-${{ env.SQLITE3_RELEASE }}.tar.gz
            sqlite3-build
          key: macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-sqlite3-${{ env.SQLITE3_VERSION }}-${{ env.SQLITE3_SHA256 }}-${{ env.SQLITE3_BUILD_PROFILE }}
          restore-keys: |
            macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-sqlite3-${{ env.SQLITE3_VERSION }}-${{ env.SQLITE3_SHA256 }}-

      - name: Cache bundled OpenSSL source and static build
        uses: actions/cache@v5
        with:
          path: |
            openssl-${{ env.OPENSSL_VERSION }}
            openssl-${{ env.OPENSSL_VERSION }}.tar.gz
            openssl-build
          key: macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-${{ env.OPENSSL_BUILD_PROFILE }}
          restore-keys: |
            macos-latest-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-

      - name: Install system dependencies (macOS)
        run: brew install cmake readline openssl@3 pkgconf

      - name: Build the bundled Lua 5.5 source tree
        run: |
          readline_prefix="$(brew --prefix readline)"
          make lua LUA_PLATFORM=macosx \
            LUA_MYCFLAGS="-fPIC -O2 -fno-lto -I$readline_prefix/include" \
            LUA_MYLDFLAGS="-O2 -fno-lto -L$readline_prefix/lib"

      # Every generated module and executable links the separate
      # ./libbacktrace/.libs/libbacktrace.a (unified stack traces). CI
      # runs LuaRocks directly rather than `make test`, so build it explicitly.
      - name: Build the bundled libbacktrace
        run: make libbacktrace

      - name: Build the pinned bundled libuv
        run: make libuv

      - name: Build the pinned private llhttp support
        run: make llhttp

      - name: Build the pinned private SQLite support
        run: make sqlite3

      - name: Build the pinned bundled OpenSSL support
        run: make openssl

      - name: Install LuaRocks into the Titan prefix
        run: make luarocks

      # The installed compiler keeps its own Lua, LuaRocks, native SDK, and
      # standard library in one per-project prefix. This is the same
      # system-tree workflow recommended to developers.
      - name: Activate the standalone Titan prefix
        run: |
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/luarocks" --version

      - name: Verify vendored Lua is on PATH
        run: lua -v

      - name: Restore macOS C-probe results
        uses: ubicloud/cache@v4
        with:
          path: .lua/var/cache/titan-probes/2
          key: titan-probes-2-${{ runner.os }}-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-test-macos-${{ github.sha }}
          restore-keys: |
            titan-probes-2-${{ runner.os }}-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-test-macos-

      # Build and install the rock so the `titan` Lua support module (ltitanlib.c,
      # required by one coder spec via `require 'titan'`) is on the Lua path.
      # `luarocks test` does not build the rock-under-test, only its dependencies.
      - name: Build and install the rock
        run: |
          bash spec/support/ci_retry_luarocks_dependencies.sh \
            luarocks make --only-deps
          luarocks make --force
          provider="$PREFIX/lib/titan/0.6/titan.so"
          static_archive="${provider%.so}.a"
          runtime_archive="$PREFIX/lib/titan/0.6/libtitan.a"
          test -f "$provider" && test ! -L "$provider"
          test -f "$static_archive" && test ! -L "$static_archive"
          test -f "$runtime_archive" && test ! -L "$runtime_archive"
          test ! -e "$PREFIX/lib/libtitan.a"

      # Exercise titanc through its real /usr/bin/env shebang. CI must provide
      # the prefix's Lua and installed compiler dependencies through PATH.
      - name: Verify titanc shebang environment
        run: titanc --help

      # Test-only dependencies are not installed by `luarocks make`.
      - name: Prepare test dependencies
        run: |
          bash spec/support/ci_retry_luarocks_dependencies.sh \
            luarocks test --prepare

      # Build one native argv/stdio child with the pinned bundled archive and
      # reuse it while smoke-testing both standard-library link modes. The OS
      # smoke invokes this executable directly through os.spawn and also
      # exercises the shell-oriented os.popen convenience separately.
      - name: Build child-process smoke fixture
        run: |
          process_smoke_dir="$RUNNER_TEMP/titan-process-smoke"
          mkdir -p "$process_smoke_dir"
          TITAN_PROCESS_SMOKE_DIR="$process_smoke_dir" \
            .lua/bin/lua -e 'require("spec.support.os_test_support").process_child(assert(os.getenv("TITAN_PROCESS_SMOKE_DIR")))'
          echo "TITAN_PROCESS_SMOKE_CHILD=$process_smoke_dir/process_child" >> "$GITHUB_ENV"

      # Run the uncovered runtime/stdlib set first. Compiler specs may clean
      # shared root outputs, so preserve the canonical image around only that
      # later compiler pass before the production mode smoke.
      - name: Run complete macOS tests without coverage
        run: |
          make stdlib-test EXTRA_TEST_FLAGS="-o gtest -v"
          make titan-stdlib-test-run \
            TITAN_FILTER='test_runtime_shutdown_closes_native_handles_but_not_files$' \
            TITAN_TEST_TIMEOUT=15
          snapshot="$RUNNER_TEMP/titan-stdlib-before-compiler.tar"
          bash spec/support/ci_stdlib_snapshot.sh save "$snapshot"
          bash spec/support/ci_test_groups.sh compiler-uncovered
          bash spec/support/ci_stdlib_snapshot.sh restore "$snapshot"

      # Run this after the bundled test suite. The smoke first exercises the
      # existing self-contained provider pair, then rebuilds titan.so/titan.a
      # against the platform OpenSSL package; the job can end in
      # system mode without another build.
      - name: Smoke-test bundled and system OpenSSL modes
        run: bash spec/support/ci_dependency_mode_smoke.sh
