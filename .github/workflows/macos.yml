name: macOS

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TITAN_BUILD_PROFILE: validation
  TITAN_ABI_VERSION: "2"

jobs:
  test-macos:
    name: macOS arm64 (${{ matrix.suite }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["full"]' || '["native","hosted-compiler-shard-1","hosted-compiler-shard-2","hosted-compiler-shard-3","hosted-compiler-shard-4"]') }}
    defaults:
      run:
        shell: bash

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua
      # Leave memory for Apple Clang on the three-CPU, 7 GB runner.
      MAKEFLAGS: "-j3"
      TITAN_JOBS: "3"
      TITAN_TEST_JOBS: "3"
      OPENSSL_MODE: bundled
      LIBUV_VERSION: "1.53.0"
      # Bump when any CMake option that affects the cached archive changes.
      LIBUV_BUILD_PROFILE: "static-pic-validation-tests-off-v3"
      LLHTTP_VERSION: "9.4.3"
      LLHTTP_SHA256: "1eb813c7437b31a87496a1cd3ed79f00746720f5e7e29c79b42c02cb69f36c39"
      LLHTTP_BUILD_PROFILE: "static-pic-hidden-c99-v1"
      SQLITE3_VERSION: "3.53.4"
      SQLITE3_RELEASE: "3530400"
      SQLITE3_SHA256: "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"
      SQLITE3_BUILD_PROFILE: "static-pic-hidden-c99-threadsafe1-v1"
      OPENSSL_VERSION: "3.5.7"
      OPENSSL_SHA256: "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"
      OPENSSL_BUILD_PROFILE: "static-pic-hidden-minimal-v1"

    steps:
      - name: Install macOS build tools
        run: |
          brew install make cmake readline openssl@3 pkgconf clang-format
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "TMPDIR=$(mktemp -d /private/tmp/titan-ci.XXXXXX)" >> "$GITHUB_ENV"
          git config --global protocol.file.allow always

      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Identify Lua and native toolchain inputs
        id: toolchain
        run: |
          test "$(uname -m)" = arm64
          gitlink=$(git rev-parse HEAD:lua-5.5.1)
          libbacktrace=$(git ls-remote https://github.com/ianlancetaylor/libbacktrace.git HEAD)
          libbacktrace=${libbacktrace%%[[:space:]]*}
          [[ $libbacktrace =~ ^[0-9a-f]{40}$ ]]
          {
            pwd -P
            sw_vers
            cc --version
            xcrun --show-sdk-path
            make --version
            cmake --version
            brew list --versions readline openssl@3
          } | tee "$RUNNER_TEMP/titan-macos-toolchain"
          digest=$(shasum -a 256 "$RUNNER_TEMP/titan-macos-toolchain" | cut -d' ' -f1)
          echo "identity=macos-15-${RUNNER_ARCH}-${TITAN_BUILD_PROFILE}-${digest}-${gitlink}" >> "$GITHUB_OUTPUT"
          echo "libbacktrace=$libbacktrace" >> "$GITHUB_OUTPUT"

      # Save only pre-Titan state. An exact key includes the recipes for both
      # builds and the install path/toolchain used by their cached objects.
      - name: Restore the Lua SDK and libbacktrace build
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: &macos-core-paths |
            .lua/bin/lua
            .lua/bin/luac
            .lua/include
            .lua/lib/liblua.a
            .lua/share/man
            .lua/src/lua-5.5.1
            libbacktrace
          key: ${{ steps.toolchain.outputs.identity }}-core-${{ steps.toolchain.outputs.libbacktrace }}-${{ hashFiles('Makefile', '.github/workflows/macos.yml') }}

      - name: Restore standalone-prefix LuaRocks dependencies
        id: rocks-cache
        uses: actions/cache/restore@v4
        with:
          path: &macos-rocks-paths |
            .lua/bin/busted
            .lua/bin/cluacov
            .lua/bin/luacov
            .lua/bin/luarocks
            .lua/bin/luarocks-admin
            .lua/etc/luarocks
            .lua/etc/titan
            .lua/lib/lua/5.5
            .lua/lib/luarocks
            .lua/share/lua/5.5
          key: ${{ steps.toolchain.outputs.identity }}-rocks-abi-${{ env.TITAN_ABI_VERSION }}-3.13.0-${{ hashFiles('Makefile', '.github/workflows/macos.yml', 'titan-0.6.0-1.rockspec') }}

      - name: Restore bundled libuv source and static build
        id: libuv-cache
        uses: actions/cache/restore@v4
        with:
          path: &macos-libuv-paths |
            libuv-v${{ env.LIBUV_VERSION }}
            libuv-v${{ env.LIBUV_VERSION }}.tar.gz
            libuv-build
          key: ${{ steps.toolchain.outputs.identity }}-libuv-${{ env.LIBUV_VERSION }}-${{ env.LIBUV_BUILD_PROFILE }}-${{ hashFiles('Makefile', 'vendor/libuv/*.patch') }}

      - name: Restore bundled llhttp source and static build
        id: llhttp-cache
        uses: actions/cache/restore@v4
        with:
          path: &macos-llhttp-paths |
            llhttp-release-v${{ env.LLHTTP_VERSION }}
            llhttp-release-v${{ env.LLHTTP_VERSION }}.tar.gz
            llhttp-build
          key: ${{ steps.toolchain.outputs.identity }}-llhttp-${{ env.LLHTTP_VERSION }}-${{ env.LLHTTP_SHA256 }}-${{ env.LLHTTP_BUILD_PROFILE }}-${{ hashFiles('Makefile') }}

      - name: Restore bundled SQLite amalgamation and static build
        id: sqlite-cache
        uses: actions/cache/restore@v4
        with:
          path: &macos-sqlite-paths |
            sqlite-autoconf-${{ env.SQLITE3_RELEASE }}
            sqlite-autoconf-${{ env.SQLITE3_RELEASE }}.tar.gz
            sqlite3-build
          key: ${{ steps.toolchain.outputs.identity }}-sqlite3-${{ env.SQLITE3_VERSION }}-${{ env.SQLITE3_SHA256 }}-${{ env.SQLITE3_BUILD_PROFILE }}-${{ hashFiles('Makefile') }}

      - name: Restore bundled OpenSSL source and static build
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: &macos-openssl-paths |
            openssl-${{ env.OPENSSL_VERSION }}
            openssl-${{ env.OPENSSL_VERSION }}.tar.gz
            openssl-build
          key: ${{ steps.toolchain.outputs.identity }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-${{ env.OPENSSL_BUILD_PROFILE }}-${{ hashFiles('Makefile') }}

      - name: Restore macOS C-probe results
        id: probe-cache
        uses: actions/cache/restore@v4
        with:
          path: .lua/var/cache/titan-probes/2
          key: titan-probes-2-${{ steps.toolchain.outputs.identity }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            titan-probes-2-${{ steps.toolchain.outputs.identity }}-

      - name: Report macOS cache hits
        run: |
          echo "Lua/libbacktrace: ${{ steps.core-cache.outputs.cache-hit || 'false' }}"
          echo "LuaRocks: ${{ steps.rocks-cache.outputs.cache-hit || 'false' }}"
          echo "libuv: ${{ steps.libuv-cache.outputs.cache-hit || 'false' }}"
          echo "llhttp: ${{ steps.llhttp-cache.outputs.cache-hit || 'false' }}"
          echo "SQLite: ${{ steps.sqlite-cache.outputs.cache-hit || 'false' }}"
          echo "OpenSSL: ${{ steps.openssl-cache.outputs.cache-hit || 'false' }}"
          echo "C-probe restore: ${{ steps.probe-cache.outputs.cache-matched-key != '' }}"

      - name: Build the bundled Lua 5.5 source tree
        run: |
          readline_prefix="$(brew --prefix readline)"
          make lua LUA_PLATFORM=macosx \
            LUA_MYCFLAGS="-O2 -fno-lto -I$readline_prefix/include" \
            LUA_MYLDFLAGS="-O2 -fno-lto -L$readline_prefix/lib"

      - name: Build the pinned native dependencies
        env:
          LIBBACKTRACE_REV: ${{ steps.toolchain.outputs.libbacktrace }}
        run: |
          if [[ ! -d libbacktrace ]]; then
            git clone --no-checkout https://github.com/ianlancetaylor/libbacktrace.git libbacktrace
            git -C libbacktrace checkout --detach "$LIBBACKTRACE_REV"
          fi
          test "$(git -C libbacktrace rev-parse HEAD)" = "$LIBBACKTRACE_REV"
          make libbacktrace libuv llhttp sqlite3 openssl

      - name: Install LuaRocks into the Titan prefix
        run: make luarocks

      # The installed compiler keeps its own Lua, LuaRocks, native SDK, and
      # standard library in one per-project prefix. This is the same
      # system-tree workflow recommended to developers.
      - name: Activate the standalone Titan prefix
        run: |
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/luarocks" --version

      - name: Verify vendored Lua is on PATH
        run: lua -v

      - name: Prepare compiler and test dependencies
        run: |
          bash spec/support/ci_retry_luarocks_dependencies.sh \
            luarocks make --only-deps
          bash spec/support/ci_retry_luarocks_dependencies.sh \
            luarocks test --prepare

      - name: Save the Lua SDK and libbacktrace build
        if: contains(fromJSON('["native","full"]'), matrix.suite) && steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *macos-core-paths
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

      - name: Save standalone-prefix LuaRocks dependencies
        if: contains(fromJSON('["native","full"]'), matrix.suite) && steps.rocks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *macos-rocks-paths
          key: ${{ steps.rocks-cache.outputs.cache-primary-key }}

      - name: Save bundled libuv source and static build
        if: contains(fromJSON('["native","full"]'), matrix.suite) && steps.libuv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *macos-libuv-paths
          key: ${{ steps.libuv-cache.outputs.cache-primary-key }}

      - name: Save bundled llhttp source and static build
        if: contains(fromJSON('["native","full"]'), matrix.suite) && steps.llhttp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *macos-llhttp-paths
          key: ${{ steps.llhttp-cache.outputs.cache-primary-key }}

      - name: Save bundled SQLite amalgamation and static build
        if: contains(fromJSON('["native","full"]'), matrix.suite) && steps.sqlite-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *macos-sqlite-paths
          key: ${{ steps.sqlite-cache.outputs.cache-primary-key }}

      - name: Save bundled OpenSSL source and static build
        if: contains(fromJSON('["native","full"]'), matrix.suite) && steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: *macos-openssl-paths
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}

      - name: Build and install the rock
        run: |
          luarocks make --force
          provider="$PREFIX/lib/titan/0.6/titan.so"
          static_archive="${provider%.so}.a"
          runtime_archive="$PREFIX/lib/titan/0.6/libtitan.a"
          test -f "$provider" && test ! -L "$provider"
          test -f "$static_archive" && test ! -L "$static_archive"
          test -f "$runtime_archive" && test ! -L "$runtime_archive"
          test ! -e "$PREFIX/lib/libtitan.a"

      - name: Save macOS C-probe results
        if: contains(fromJSON('["native","full"]'), matrix.suite)
        uses: actions/cache/save@v4
        with:
          path: .lua/var/cache/titan-probes/2
          key: ${{ steps.probe-cache.outputs.cache-primary-key }}

      # Exercise titanc through its real /usr/bin/env shebang. CI must provide
      # the prefix's Lua and installed compiler dependencies through PATH.
      - name: Verify titanc shebang environment
        run: titanc --help

      - name: Run a compiler and language shard without coverage
        if: startsWith(matrix.suite, 'hosted-compiler-shard-')
        env:
          TITAN_ROCK_TEST_JOBS: "2"
          TITAN_COMPILER_GROUP: ${{ matrix.suite }}
        run: bash spec/support/run_parallel_compiler_tests.sh "$TITAN_COMPILER_GROUP"

      # Build one native argv/stdio child with the pinned bundled archive and
      # reuse it while smoke-testing both standard-library link modes. The OS
      # smoke invokes this executable directly through os.spawn and also
      # exercises the shell-oriented os.popen convenience separately.
      - name: Build child-process smoke fixture
        if: contains(fromJSON('["native","full"]'), matrix.suite)
        run: |
          process_smoke_dir="$RUNNER_TEMP/titan-process-smoke"
          mkdir -p "$process_smoke_dir"
          TITAN_PROCESS_SMOKE_DIR="$process_smoke_dir" \
            .lua/bin/lua -e 'require("spec.support.os_test_support").process_child(assert(os.getenv("TITAN_PROCESS_SMOKE_DIR")))'
          echo "TITAN_PROCESS_SMOKE_CHILD=$process_smoke_dir/process_child" >> "$GITHUB_ENV"

      - name: Run macOS stdlib tests without coverage
        if: contains(fromJSON('["native","full"]'), matrix.suite)
        run: |
          make stdlib-test EXTRA_TEST_FLAGS="-o gtest -v"
          luarocks make --force
          log="$RUNNER_TEMP/titan-native-identical-reinstall.log"
          make titan-stdlib-test-build TITAN_VERBOSE=1 2>&1 | tee "$log"
          grep -Eq '^Titan object hit ' "$log"
          grep -Eq '^Titan native hit ' "$log"
          grep -Eq '^Titan link hit ' "$log"
          if grep -Eq '^Titan (object|native|link) miss |os_process_host_child[.]c' "$log"; then
            echo "Identical SDK reinstall compiled or linked native artifacts" >&2
            exit 1
          fi
          make titan-stdlib-test-run \
            TITAN_FILTER='test_runtime_shutdown_closes_native_handles_but_not_files$' \
            TITAN_TEST_TIMEOUT=15

      # The manual cell runs the full suite on one VM. Compiler workers use
      # private checkout copies and leave the canonical provider untouched.
      - name: Run all compiler and language specs on manual dispatch
        if: matrix.suite == 'full'
        env:
          TITAN_ROCK_TEST_JOBS: "2"
        run: bash spec/support/run_parallel_compiler_tests.sh compiler-uncovered

      # Run this after the bundled test suite. The smoke first exercises the
      # existing self-contained provider pair, then rebuilds titan.so/titan.a
      # against the platform OpenSSL package; the job can end in
      # system mode without another build.
      - name: Smoke-test bundled and system OpenSSL modes
        if: contains(fromJSON('["native","full"]'), matrix.suite)
        run: bash spec/support/ci_dependency_mode_smoke.sh
