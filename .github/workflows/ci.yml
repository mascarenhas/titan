name: CI

on:
  push:
    # "*" matches only top-level branch names; "**" also matches names with
    # slashes (e.g. "tooling/foo"), so every pushed branch triggers CI.
    branches: ["**"]
  workflow_dispatch:  # Manual trigger to run the complete macOS suite

jobs:
  # Build and install the regular Linux tree once per workflow. The three
  # isolated 1-core test shards restore this exact tree instead of each paying
  # to rebuild Lua, libbacktrace, libuv, Titan, and the test dependencies.
  prepare-linux:
    name: prepare (ubuntu-slim, regular)
    runs-on: ubuntu-slim
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LUAROCKS_VERSION: "3.13.0"
      LIBUV_VERSION: "1.52.1"
      # Bump when any CMake option that affects the cached archive changes.
      LIBUV_BUILD_PROFILE: "static-pic-release-tests-off-v1"

    steps:
      - uses: actions/checkout@v6

      - name: Cache LuaRocks bootstrap install
        uses: actions/cache@v5
        with:
          path: lua_install
          key: ubuntu-slim-luarocks-${{ env.LUAROCKS_VERSION }}

      - name: Cache project lua_modules
        uses: actions/cache@v5
        with:
          path: lua_modules
          key: ubuntu-slim-${{ runner.arch }}-lua_modules-${{ hashFiles('titan-dev-1.rockspec') }}
          restore-keys: |
            ubuntu-slim-${{ runner.arch }}-lua_modules-

      - name: Cache bundled libuv source and static build
        uses: actions/cache@v5
        with:
          path: |
            libuv-v${{ env.LIBUV_VERSION }}
            libuv-v${{ env.LIBUV_VERSION }}.tar.gz
            libuv-build
          key: ubuntu-slim-${{ runner.arch }}-libuv-${{ env.LIBUV_VERSION }}-${{ env.LIBUV_BUILD_PROFILE }}-${{ hashFiles('Makefile') }}

      - name: Install regular build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake curl libreadline-dev libuv1-dev pkg-config

      - name: Build the bundled Lua 5.5 source tree
        run: make lua LUA_PLATFORM=linux

      - name: Build the bundled libbacktrace
        run: make libbacktrace

      - name: Build the pinned bundled libuv
        run: make libuv

      - name: Install LuaRocks from source
        run: |
          if [ ! -f lua_install/bin/luarocks ]; then
            curl -fL -o "luarocks-${LUAROCKS_VERSION}.tar.gz" \
              "https://luarocks.github.io/luarocks/releases/luarocks-${LUAROCKS_VERSION}.tar.gz"
            tar zxf "luarocks-${LUAROCKS_VERSION}.tar.gz"
            cd "luarocks-${LUAROCKS_VERSION}"
            ./configure --prefix="$GITHUB_WORKSPACE/lua_install" \
                        --with-lua="$GITHUB_WORKSPACE/.lua"
            make
            make install
            cd ..
            rm -rf "luarocks-${LUAROCKS_VERSION}" "luarocks-${LUAROCKS_VERSION}.tar.gz"
          fi

      - name: Set up project-local luarocks tree
        run: |
          export PATH="$PWD/lua_install/bin:$PATH"
          luarocks init --lua-dir="$PWD/.lua"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          echo "$PWD/lua_modules/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(./luarocks path --lr-path);;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(./luarocks path --lr-cpath);;" >> "$GITHUB_ENV"

      - name: Build and install the rock
        run: ./luarocks make

      - name: Verify titanc shebang environment
        run: ./titanc --help

      - name: Prepare test dependencies
        run: ./luarocks test --prepare

      - name: Build child-process smoke fixture
        run: |
          process_smoke_dir="$RUNNER_TEMP/titan-process-smoke"
          mkdir -p "$process_smoke_dir"
          TITAN_PROCESS_SMOKE_DIR="$process_smoke_dir" \
            .lua/bin/lua -e 'require("spec.support.phase6").process_child(assert(os.getenv("TITAN_PROCESS_SMOKE_DIR")))'
          echo "TITAN_PROCESS_SMOKE_CHILD=$process_smoke_dir/process_child" >> "$GITHUB_ENV"

      - name: Smoke-test system libuv mode and mode switching
        run: bash spec/support/ci_libuv_mode_smoke.sh

      # A tar layer preserves the complete checkout's source/output mtimes,
      # hidden .lua tree, executable bits, and relative standard-library
      # symlinks. Direct artifact upload avoids wrapping it in another archive.
      - name: Pack prepared Linux tree
        run: |
          printf '%s\n' "$GITHUB_WORKSPACE" > .ci-prepared-workspace
          tar \
            --exclude='./.git' \
            --exclude='./libbacktrace/.git' \
            -czf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" .

      - name: Upload prepared Linux tree
        uses: actions/upload-artifact@v7
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}/titan-linux-prepared.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  test-linux:
    name: test (ubuntu-slim, ${{ matrix.group }})
    needs: prepare-linux
    runs-on: ubuntu-slim

    strategy:
      fail-fast: false
      matrix:
        group: [compiler, library-uv-fs, library-net-os]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - name: Download prepared Linux tree
        uses: actions/download-artifact@v8
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}

      - name: Restore prepared Linux tree and environment
        run: |
          tar -xzf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" \
            -C "$GITHUB_WORKSPACE"
          test "$(cat .ci-prepared-workspace)" = "$GITHUB_WORKSPACE"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          echo "$PWD/lua_modules/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(./luarocks path --lr-path);;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(./luarocks path --lr-cpath);;" >> "$GITHUB_ENV"
          .lua/bin/lua -v

      # Compiler and language tests own LuaCov coverage. Library suites still
      # run in full outside LuaCov because it cannot measure Titan/C libraries.
      - name: Run selected Linux test group
        run: |
          case "${{ matrix.group }}" in
            compiler)
              bash spec/support/ci_test_groups.sh compiler
              ;;
            library-uv-fs)
              bash spec/support/ci_test_groups.sh library-uv-fs
              ;;
            library-net-os)
              bash spec/support/ci_test_groups.sh library-serial
              bash spec/support/ci_test_groups.sh library-net-os
              ;;
            *)
              echo "unknown regular test group: ${{ matrix.group }}" >&2
              exit 2
              ;;
          esac

      - name: Generate coverage report
        if: success() && matrix.group == 'compiler'
        run: |
          luacov "titan%-compiler" "/spec/[^/]+.lua" "titanc"
          grep "Summary" -B1 -A1000 luacov.report.out

      - name: Upload coverage to Codecov
        if: success() && matrix.group == 'compiler'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false

  # macOS remains independent of Linux preparation: a transient Linux build
  # failure must not suppress the per-push canary or a manually requested full
  # macOS release gate.
  test-macos:
    name: test (macos-latest, ${{ github.event_name == 'workflow_dispatch' && 'macos-full' || 'macos-canary' }})
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LUAROCKS_VERSION: "3.13.0"
      LIBUV_VERSION: "1.52.1"
      # Bump when any CMake option that affects the cached archive changes.
      LIBUV_BUILD_PROFILE: "static-pic-release-tests-off-v1"

    steps:
      - uses: actions/checkout@v6

      - name: Cache LuaRocks bootstrap install
        uses: actions/cache@v5
        with:
          path: lua_install
          key: macos-latest-luarocks-${{ env.LUAROCKS_VERSION }}

      - name: Cache project lua_modules
        uses: actions/cache@v5
        with:
          path: lua_modules
          key: macos-latest-${{ runner.arch }}-lua_modules-${{ hashFiles('titan-dev-1.rockspec') }}
          restore-keys: |
            macos-latest-${{ runner.arch }}-lua_modules-

      - name: Cache bundled libuv source and static build
        uses: actions/cache@v5
        with:
          path: |
            libuv-v${{ env.LIBUV_VERSION }}
            libuv-v${{ env.LIBUV_VERSION }}.tar.gz
            libuv-build
          key: macos-latest-${{ runner.arch }}-libuv-${{ env.LIBUV_VERSION }}-${{ env.LIBUV_BUILD_PROFILE }}-${{ hashFiles('Makefile') }}

      - name: Install system dependencies (macOS)
        run: brew install cmake libuv pkgconf

      - name: Build the bundled Lua 5.5 source tree
        run: make lua LUA_PLATFORM=macosx

      # The runtime (titan.o) and every generated module/executable link
      # ./libbacktrace/.libs/libbacktrace.a (unified stack traces). CI runs
      # luarocks directly rather than `make test`, so build the tree explicitly.
      - name: Build the bundled libbacktrace
        run: make libbacktrace

      - name: Build the pinned bundled libuv
        run: make libuv

      # Install LuaRocks from source, pointing it at the vendored Lua 5.5 in
      # .lua/.  This replaces hererocks and eliminates the Python dependency.
      - name: Install LuaRocks from source
        run: |
          if [ ! -f lua_install/bin/luarocks ]; then
            curl -fL -o "luarocks-${LUAROCKS_VERSION}.tar.gz" \
              "https://luarocks.github.io/luarocks/releases/luarocks-${LUAROCKS_VERSION}.tar.gz"
            tar zxf "luarocks-${LUAROCKS_VERSION}.tar.gz"
            cd "luarocks-${LUAROCKS_VERSION}"
            ./configure --prefix="$GITHUB_WORKSPACE/lua_install" \
                        --with-lua="$GITHUB_WORKSPACE/.lua"
            make
            make install
            cd ..
            rm -rf "luarocks-${LUAROCKS_VERSION}" "luarocks-${LUAROCKS_VERSION}.tar.gz"
          fi

      # Set up the project-local luarocks tree (lua_modules/), matching the
      # README's developer workflow.  The bootstrap luarocks binary is only
      # needed for this one-time `luarocks init`; afterwards the project's
      # ./luarocks wrapper is used for everything.
      - name: Set up project-local luarocks tree
        run: |
          export PATH="$PWD/lua_install/bin:$PATH"
          luarocks init --lua-dir="$PWD/.lua"
          # Make the vendored Lua available to ordinary `#!/usr/bin/env lua`
          # tools such as titanc, and add the rocks bin dir for busted and the
          # installed command wrappers.  Explicit ./lua and ./luarocks calls
          # remain useful when their project-local package paths are required.
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          echo "$PWD/lua_modules/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(./luarocks path --lr-path);;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(./luarocks path --lr-cpath);;" >> "$GITHUB_ENV"

      - name: Verify vendored Lua is on PATH
        run: lua -v

      # Build and install the rock so the `titan` C runtime module (titanlib.c,
      # required by one coder spec via `require 'titan'`) is on the Lua path.
      # `luarocks test` does not build the rock-under-test, only its dependencies.
      - name: Build and install the rock
        run: ./luarocks make

      # Exercise titanc through its real /usr/bin/env shebang. This deliberately
      # does not select a Lua interpreter inside the script: CI must provide the
      # vendored Lua and installed compiler dependencies through PATH/LUA_PATH.
      - name: Verify titanc shebang environment
        run: ./titanc --help

      # Test-only dependencies are not installed by `luarocks make`.
      - name: Prepare test dependencies
        run: ./luarocks test --prepare

      # Build one native argv/stdio child with the pinned bundled archive and
      # reuse it while smoke-testing both standard-library link modes. The OS
      # smoke invokes this executable directly through os.spawn/communicate.
      - name: Build child-process smoke fixture
        run: |
          process_smoke_dir="$RUNNER_TEMP/titan-process-smoke"
          mkdir -p "$process_smoke_dir"
          TITAN_PROCESS_SMOKE_DIR="$process_smoke_dir" \
            .lua/bin/lua -e 'require("spec.support.phase6").process_child(assert(os.getenv("TITAN_PROCESS_SMOKE_DIR")))'
          echo "TITAN_PROCESS_SMOKE_CHILD=$process_smoke_dir/process_child" >> "$GITHUB_ENV"

      # The normal build above proves the pinned, self-contained archive path.
      # Also compile and load against the platform development package, then
      # switch back without cleaning. This locks the optional pkg-config mode
      # and the Makefile configuration stamp on both supported hosts.
      - name: Smoke-test system libuv mode and mode switching
        run: bash spec/support/ci_libuv_mode_smoke.sh

      - name: Run complete macOS tests without coverage
        if: github.event_name == 'workflow_dispatch'
        run: |
          bash spec/support/ci_test_groups.sh compiler-uncovered
          bash spec/support/ci_test_groups.sh libraries

      # Busted has no percentage-sampling option. The repository sampler uses
      # the commit as a replayable seed, while the production smokes above and
      # fixed native tests keep every async portability boundary represented.
      - name: Run macOS canary tests
        if: github.event_name != 'workflow_dispatch'
        run: bash spec/support/ci_test_groups.sh macos-canary "$GITHUB_SHA"

  # The sanitizer dependency and Titan build used to consume about 3.5 minutes
  # in every shard. Produce it once, verify its instrumentation, and distribute
  # the exact tree to the three isolated native-memory test processes.
  prepare-sanitizer:
    name: prepare (ubuntu-slim, sanitizer)
    runs-on: ubuntu-slim
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LUAROCKS_VERSION: "3.13.0"
      SANITIZER_FLAGS: "-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      # Every Titan DSO intentionally embeds the vendored static Lua archive;
      # disable only ASan's cross-image ODR diagnostic for those duplicate Lua
      # globals. Address, bounds, lifetime, and leak checks remain enabled.
      ASAN_OPTIONS: "detect_odr_violation=0:detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1:abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - uses: actions/checkout@v6

      - name: Install sanitizer build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake curl libreadline-dev

      - name: Build sanitizer-enabled native dependencies
        run: |
          make lua \
            LUA_MYCFLAGS="-fPIC ${SANITIZER_FLAGS}" \
            LUA_MYLDFLAGS="${SANITIZER_FLAGS}" \
            LUA_MYLIBS="${SANITIZER_FLAGS}"
          make libbacktrace \
            LIBBT_CFLAGS="-fPIC ${SANITIZER_FLAGS}"
          make libuv \
            LIBUV_BUILD_TYPE=Debug \
            LIBUV_BUILD_CFLAGS="${SANITIZER_FLAGS}"

      - name: Install LuaRocks for the sanitizer Lua
        run: |
          curl -fL -o "luarocks-${LUAROCKS_VERSION}.tar.gz" \
            "https://luarocks.github.io/luarocks/releases/luarocks-${LUAROCKS_VERSION}.tar.gz"
          tar zxf "luarocks-${LUAROCKS_VERSION}.tar.gz"
          cd "luarocks-${LUAROCKS_VERSION}"
          ./configure --prefix="$GITHUB_WORKSPACE/lua_install" \
                      --with-lua="$GITHUB_WORKSPACE/.lua"
          make
          make install
          cd ..
          rm -rf "luarocks-${LUAROCKS_VERSION}" "luarocks-${LUAROCKS_VERSION}.tar.gz"

      - name: Set up sanitizer project tree
        run: |
          export PATH="$PWD/lua_install/bin:$PATH"
          luarocks init --lua-dir="$PWD/.lua"
          ./luarocks install busted
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          echo "$PWD/lua_modules/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(./luarocks path --lr-path);;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(./luarocks path --lr-cpath);;" >> "$GITHUB_ENV"

      - name: Build sanitizer-enabled Titan artifacts
        run: |
          TITAN_EXTRA_CFLAGS="${SANITIZER_FLAGS}" \
          TITAN_EXTRA_LDFLAGS="${SANITIZER_FLAGS}" \
          LIBUV_BUILD_TYPE=Debug \
          LIBUV_BUILD_CFLAGS="${SANITIZER_FLAGS}" \
            ./luarocks make
          readelf -Ws .lua/bin/lua | grep __asan_
          readelf -Ws .lua/bin/lua | grep __ubsan_
          readelf -Ws uv.so | grep __asan_
          readelf -Ws uv.so | grep __ubsan_
          # titanlib is small enough that UBSan may emit no handler reference;
          # an ASan registration symbol proves this separate C module used the
          # threaded native instrumentation flags.
          readelf -Ws titan.so | grep __asan_

      - name: Pack prepared sanitizer tree
        run: |
          printf '%s\n' "$GITHUB_WORKSPACE" > .ci-prepared-workspace
          tar \
            --exclude='./.git' \
            --exclude='./libbacktrace/.git' \
            -czf "$RUNNER_TEMP/titan-sanitizer-prepared.tar.gz" .

      - name: Upload prepared sanitizer tree
        uses: actions/upload-artifact@v7
        with:
          name: titan-sanitizer-prepared.tar.gz
          path: ${{ runner.temp }}/titan-sanitizer-prepared.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Linux owns the native-memory release gate. Each family gets its own 1-core
  # runner so the expensive transformed uv variants stay below the slim
  # runner's limit without duplicating the sanitizer build.
  sanitizer:
    name: sanitizer (${{ matrix.group }})
    needs: prepare-sanitizer
    runs-on: ubuntu-slim

    strategy:
      fail-fast: false
      matrix:
        group: [core-uv, timer-fs, net-os]

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SANITIZER_FLAGS: "-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      # Every Titan DSO intentionally embeds the vendored static Lua archive;
      # disable only ASan's cross-image ODR diagnostic for those duplicate Lua
      # globals. Address, bounds, lifetime, and leak checks remain enabled.
      ASAN_OPTIONS: "detect_odr_violation=0:detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1:abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - uses: actions/checkout@v6

      - name: Download prepared sanitizer tree
        uses: actions/download-artifact@v8
        with:
          name: titan-sanitizer-prepared.tar.gz
          path: ${{ runner.temp }}

      - name: Restore prepared sanitizer tree and environment
        run: |
          tar -xzf "$RUNNER_TEMP/titan-sanitizer-prepared.tar.gz" \
            -C "$GITHUB_WORKSPACE"
          test "$(cat .ci-prepared-workspace)" = "$GITHUB_WORKSPACE"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          echo "$PWD/lua_modules/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(./luarocks path --lr-path);;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(./luarocks path --lr-cpath);;" >> "$GITHUB_ENV"
          readelf -Ws .lua/bin/lua | grep __asan_
          readelf -Ws uv.so | grep __ubsan_

      - name: Run native async sanitizer gate (${{ matrix.group }})
        env:
          TITAN_TEST_EXTRA_CFLAGS: ${{ env.SANITIZER_FLAGS }}
          TITAN_TEST_EXTRA_LDFLAGS: ${{ env.SANITIZER_FLAGS }}
          MINICORO_TEST_CC: gcc
          MINICORO_TEST_CFLAGS: ${{ env.SANITIZER_FLAGS }}
        run: |
          case "${{ matrix.group }}" in
            core-uv)
              ./lua_modules/bin/busted -o gtest -v \
                spec/minicoro_spec.lua \
                spec/coder/uv_spec.lua \
                spec/coder/uv_phase2_spec.lua \
                spec/coder/uv_fault_spec.lua \
                spec/coder/uv_bootstrap_spec.lua
              ;;
            timer-fs)
              ./lua_modules/bin/busted -o gtest -v \
                spec/coder/uv_states_spec.lua \
                spec/coder/timer_spec.lua \
                spec/coder/fs_spec.lua \
                spec/coder/fs_fault_spec.lua \
                spec/coder/uv_phase4_spec.lua
              ;;
            net-os)
              ./lua_modules/bin/busted -o gtest -v \
                spec/coder/net_spec.lua \
                spec/coder/net_fault_spec.lua \
                spec/coder/os_signal_spec.lua \
                spec/coder/os_signal_fault_spec.lua \
                spec/coder/os_helpers_spec.lua \
                spec/coder/os_helpers_fault_spec.lua \
                spec/coder/os_process_spec.lua \
                spec/coder/os_process_fault_spec.lua
              ;;
            *)
              echo "unknown sanitizer group: ${{ matrix.group }}" >&2
              exit 2
              ;;
          esac
