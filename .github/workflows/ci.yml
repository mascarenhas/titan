name: CI

on:
  push:
    # "*" matches only top-level branch names; "**" also matches names with
    # slashes (e.g. "tooling/foo"), so every pushed branch triggers CI.
    branches: ["**"]

# Match the two CPUs on standard private-repository hosted runners for Make's
# native dependency DAG and each titanc invocation.
env:
  TITAN_BUILD_PROFILE: validation
  MAKEFLAGS: "-j2"
  TITAN_JOBS: "2"
  TITAN_ABI_VERSION: "2"
  # Keep canonical and sanitizer providers bundled; the canary tests system OpenSSL.
  OPENSSL_MODE: bundled

jobs:
  # Implementation notes: doc/implementation/continuous-integration.md#linux-job-graph-and-concurrency
  # Prepare only Lua, compiler dependencies and native compiler support. The
  # compiler shards can start without waiting for any standard-library build.
  build-compiler:
    name: compiler dependencies (ubuntu-24.04)
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CC: gcc-14
      LUA_CC: gcc-14
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Cache standalone-prefix LuaRocks dependencies
        uses: ubicloud/cache@v4
        with:
          path: |
            .lua/bin/busted
            .lua/bin/cluacov
            .lua/bin/luacov
            .lua/bin/luarocks
            .lua/bin/luarocks-admin
            .lua/etc/luarocks
            .lua/etc/titan
            .lua/lib/lua/5.5
            .lua/lib/luarocks
            .lua/share/lua/5.5
          key: ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-prefix-stock-luarocks-host-optimized-v2-abi-${{ env.TITAN_ABI_VERSION }}-rocks-3.13.0-${{ hashFiles('titan-0.6.0-1.rockspec') }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-prefix-stock-luarocks-host-optimized-v2-abi-${{ env.TITAN_ABI_VERSION }}-rocks-3.13.0-

      - name: Install compiler build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-14 curl libreadline-dev

      - name: Prepare the standalone prefix
        run: make lua luarocks

      - name: Prepare the cached Titan dependency tree
        run: |
          clean_titan_environment() {
            env \
              -u LUA_PATH \
              -u LUA_CPATH \
              -u LUA_PATH_5_5 \
              -u LUA_CPATH_5_5 \
              -u LUA_INIT \
              -u LUA_INIT_5_5 \
              -u TITAN_PATH \
              -u TITAN_PATH_0_6 \
              -u TITAN_ROOT \
              "$@"
          }

          # The ABI-keyed dependency cache can still contain this ABI's
          # preceding commit. Remove only known Titan-owned registration and
          # manifest-external public names before the first checkout install.
          if clean_titan_environment \
              "$PREFIX/bin/luarocks" show titan >/dev/null 2>&1; then
            clean_titan_environment \
              "$PREFIX/bin/luarocks" remove titan --force
          fi
          rm -f "$PREFIX/share/titan/0.6/src/titan/test.titan"
          rm -f "$PREFIX/lib/lua/5.5/titan.so"
          # The restored Lua tree is not part of the cache key. Drop the
          # compiler modules so removals are visible, and drop the pre-cutover
          # share/lua/5.5/titan shim directory outright.
          rm -rf "$PREFIX/share/lua/5.5/titan-compiler" \
            "$PREFIX/share/lua/5.5/c-parser"
          rm -rf "$PREFIX/share/lua/5.5/titan"
          if clean_titan_environment \
              "$PREFIX/bin/luarocks" show titan >/dev/null 2>&1; then
            echo "cached Titan rock remained registered after removal" >&2
            exit 1
          fi

          # Titan's Lua roots its default paths at its executable directory
          # and carries no Titan provider entry.
          clean_titan_environment "$PREFIX/bin/lua" -E -e '
            local cpath = package.cpath
            local current = assert(os.getenv("PREFIX")) ..
              "/bin/../lib/lua/5.5/?.so"
            assert(cpath:find(current, 1, true), cpath)
            assert(not cpath:find("/lib/titan/", 1, true), cpath)
          '

      - name: Activate the standalone Titan prefix
        run: |
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/lua" -v
          "$PREFIX/bin/luarocks" --version

      - name: Install compiler and test dependencies
        run: |
          luarocks make --only-deps
          luarocks test --prepare

      - name: Build the bundled libbacktrace
        run: LIBBT_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ianlancetaylor/libbacktrace.git" make libbacktrace

      - name: Build and install the compiler SDK without the stdlib
        run: |
          make install-compiler-sdk
          titanc --help
          lua -E -e 'assert(type(require("titan").backtrace) == "function")'
          test -f "$PREFIX/lib/lua/5.5/titan.so"
          test -f "$PREFIX/lib/titan/0.6/libtitan.a"
          test ! -e "$PREFIX/lib/titan/0.6/titan.so"
          test ! -e "$PREFIX/lib/titan/0.6/titan.a"
          test ! -e "$PREFIX/share/lua/5.5/titan"

      # Preserve source/output mtimes, modes and the compiler prefix. There are
      # no stdlib images or stdlib native dependency builds in this archive.
      - name: Pack prepared Linux tree
        run: |
          printf '%s\n' "$GITHUB_WORKSPACE" > .ci-prepared-workspace
          tar \
            --exclude='./.git' \
            --exclude='./libbacktrace/.git' \
            --exclude='./.lua/var/cache/titan-probes' \
            -czf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" .
          if tar -tzf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" |
              grep -E '^\./\.lua/var/cache/titan-probes(/|$)' >/dev/null; then
            echo "prepared tree contains the independent C-probe cache" >&2
            exit 1
          fi

      - name: Upload prepared Linux tree
        uses: actions/upload-artifact@v7
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}/titan-linux-prepared.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  test-linux-compiler:
    name: compiler/language shards ${{ matrix.shard-pair }} (ubuntu-24.04, LuaCov)
    needs: build-compiler
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-2
    # Include full LuaCov collection in the real native-coverage compiler children.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard-pair: ["1-2", "3-4"]
    permissions:
      contents: read
      id-token: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CC: gcc-14

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install matching compiler and coverage tools
        run: sudo apt-get update && sudo apt-get install -y gcc-14 clang-format python3-venv

      - name: Download prepared Linux tree
        uses: actions/download-artifact@v8
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}

      - name: Restore prepared Linux tree and environment
        run: |
          tar -xzf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" \
            -C "$GITHUB_WORKSPACE"
          test "$(cat .ci-prepared-workspace)" = "$GITHUB_WORKSPACE"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          .lua/bin/lua -v

      - name: Prepare pinned native coverage reporter for compiler regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/titan-compiler-coverage-tools"
          "$RUNNER_TEMP/titan-compiler-coverage-tools/bin/pip" install -r scripts/titan-coverage-requirements.txt
          gcc-14 --version
          gcov-14 --version
          clang-format --version
          "$RUNNER_TEMP/titan-compiler-coverage-tools/bin/gcovr" --version

      # Each worker gets a private copy of the prepared checkout, so legacy
      # compiler cleanup and checkout-root fixture names cannot race. Each
      # shard first runs ordinary compiler tests with LuaCov and then its
      # explicitly tagged stress oracles without LuaCov. They share the
      # prepared installed prefix and the host's /tmp temporary-file namespace
      # (Lua's POSIX os.tmpname() ignores the per-worker TMPDIR). Each runner
      # executes two shards concurrently and publishes their merged stats only
      # after both pass.
      - name: Run two isolated compiler shards with covered and stress invocations
        env:
          TITAN_EXTRA_CFLAGS: "-O0 -fno-lto"
          TITAN_EXTRA_LDFLAGS: "-fno-lto"
          TITAN_COVERAGE_TEST_CC: gcc-14
          TITAN_COVERAGE_TEST_GCOV: gcov-14
          TITAN_COVERAGE_TEST_GCOVR: ${{ runner.temp }}/titan-compiler-coverage-tools/bin/gcovr
          TITAN_COVERAGE_TEST_REQUIRED: "1"
        run: bash spec/support/ci_parallel_compiler_tests.sh "${{ matrix.shard-pair }}"

      - name: Generate compiler coverage report
        run: |
          luacov "titan%-compiler/" "titanc$"
          grep "Summary" -B1 -A1000 luacov.report.out
          lua spec/support/prepare_codecov_report.lua \
            luacov.report.out luacov.codecov.out

      - name: Upload compiler pair coverage
        uses: actions/upload-artifact@v7
        with:
          name: titan-compiler-coverage-${{ matrix.shard-pair }}
          path: |
            luacov.stats.out
            luacov.codecov.out
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      # Codecov merges the two pairs and the stdlib integration report under
      # the same flag; no merger job needs to restore the prepared tree.
      - name: Upload compiler coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./luacov.codecov.out
          flags: compiler
          name: compiler-${{ matrix.shard-pair }}
          use_oidc: true

  # Independent browser gates restore the same pinned toolchains into separate
  # validation prefixes. Keep the long-running budget fixtures with the portable
  # loader/runner/trace suites; SDK and stdlib integrations run in parallel.
  # Implementation notes: doc/implementation/continuous-integration.md#linux-job-graph-and-concurrency
  browser-toolchain:
    name: browser target real toolchain (ubuntu-24.04, emsdk 6.0.13, Node 26)
    needs: build-compiler
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    permissions:
      contents: read
      # The browser gate uploads its own compiler coverage report.
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MAKEFLAGS: "-j4"
      TITAN_JOBS: "4"
      # emsdk_env.sh unsets every EMSDK_* input it does not set itself, so the
      # pin and the installation root must not use that prefix.
      TITAN_EMSDK_VERSION: "6.0.13"
      TITAN_EMSDK_ROOT: ${{ github.workspace }}/.emsdk
      TITAN_NODE_VERSION: "26.13.0"
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua
      # Chrome for Testing 156.0.8078.80, the version verified for #329. The
      # ZIP digest is pinned because CfT publishes no .sha256 sidecar.
      TITAN_CHROME_VERSION: "156.0.8078.80"
      TITAN_CHROME_SHA256: "547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4"
      TITAN_CHROME_ROOT: ${{ github.workspace }}/.chrome

    steps:
      - uses: actions/checkout@v6
        with:
          # The fork's install-browser reads the gitlink revision from the
          # submodule checkout to write the build record.
          submodules: true

      - name: Download prepared Linux tree
        uses: actions/download-artifact@v8
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}

      - name: Restore prepared Linux tree and environment
        run: |
          tar -xzf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" \
            -C "$GITHUB_WORKSPACE"
          test "$(cat .ci-prepared-workspace)" = "$GITHUB_WORKSPACE"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          .lua/bin/lua -v

      - name: Restore the pinned Emscripten SDK
        uses: ubicloud/cache@v4
        with:
          path: ${{ github.workspace }}/.emsdk
          key: ubuntu-24.04-${{ runner.arch }}-emsdk-${{ env.TITAN_EMSDK_VERSION }}-v1
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-emsdk-${{ env.TITAN_EMSDK_VERSION }}-

      - name: Install Emscripten ${{ env.TITAN_EMSDK_VERSION }}
        run: |
          if [ ! -x "$TITAN_EMSDK_ROOT/emsdk" ]; then
            # The clone is the installer, not the pin: the pin is the release
            # tag that install activates and the record names.
            rm -rf "$TITAN_EMSDK_ROOT"
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git \
              "$TITAN_EMSDK_ROOT"
          fi
          # Both commands are idempotent, so a restored installation only
          # verifies the pinned version instead of downloading it again.
          "$TITAN_EMSDK_ROOT/emsdk" install "$TITAN_EMSDK_VERSION"
          "$TITAN_EMSDK_ROOT/emsdk" activate "$TITAN_EMSDK_VERSION"
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          emcc --version | head -n 1
          installed=$(emcc --version |
            sed -n 's/.*) \([0-9][0-9.]*\).*/\1/p' | head -n 1)
          test "$installed" = "$TITAN_EMSDK_VERSION"

      # The Emscripten SDK still bundles Node 24 for its own tools. Browser
      # images use the separately pinned, unflagged JSPI runtime.
      - name: Install the pinned Node 26 runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.TITAN_NODE_VERSION }}

      - name: Select and qualify Node 26
        run: |
          node_bin=$(command -v node)
          version=$("$node_bin" --version)
          test "$version" = "v$TITAN_NODE_VERSION"
          "$node_bin" -e 'if (typeof WebAssembly.promising !== "function" || typeof WebAssembly.Suspending !== "function") throw new Error("Node requires unflagged JSPI")'
          echo "TITAN_NODE=$node_bin" >> "$GITHUB_ENV"
          "$node_bin" --version

      - name: Restore the pinned Chrome for Testing headless shell
        uses: ubicloud/cache@v4
        with:
          path: ${{ env.TITAN_CHROME_ROOT }}
          # The digest is part of the identity: re-pinning the same version to a
          # different ZIP must never restore the previous binary.
          key: ubuntu-24.04-${{ runner.arch }}-chrome-headless-shell-${{ env.TITAN_CHROME_VERSION }}-${{ env.TITAN_CHROME_SHA256 }}-v1

      # act has no browser, so the executable and its runtime libraries are
      # provisioned here rather than assumed from the runner image.
      - name: Install Chrome for Testing headless shell ${{ env.TITAN_CHROME_VERSION }}
        run: |
          set -euo pipefail
          chrome="$TITAN_CHROME_ROOT/chrome-headless-shell-linux64/chrome-headless-shell"
          if [ ! -x "$chrome" ]; then
            archive="$RUNNER_TEMP/chrome-headless-shell-$TITAN_CHROME_VERSION.zip"
            curl -fsSL -o "$archive" \
              "https://storage.googleapis.com/chrome-for-testing-public/$TITAN_CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            echo "$TITAN_CHROME_SHA256  $archive" | sha256sum -c --strict -
            rm -rf "$TITAN_CHROME_ROOT"
            mkdir -p "$TITAN_CHROME_ROOT"
            # Python's zipfile writes members with the process umask; the helper
            # restores each recorded Unix mode, including the shell's +x bit.
            python3 scripts/browser_extract_zip.py "$archive" "$TITAN_CHROME_ROOT"
            rm -f "$archive"
          fi
          test -x "$chrome"
          if ! ldd "$chrome" | grep -q "not found"; then
            echo "Chrome for Testing runtime libraries are present"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 \
              libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
              libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
              fonts-liberation
          fi
          if ldd "$chrome" | grep -q "not found"; then
            echo "missing Chrome for Testing runtime libraries:" >&2
            ldd "$chrome" | grep "not found" >&2
            exit 1
          fi
          echo "TITAN_CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      # Ubuntu 24.04 enables kernel.apparmor_restrict_unprivileged_userns by
      # default, which kills Chrome's user-namespace sandbox before CDP can
      # attach ("CDP pipe closed before shutdown"). Chrome keeps its sandbox:
      # this only relaxes the host restriction, and only when it is present.
      - name: Allow Chrome's user-namespace sandbox on the CI host
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/browser-chrome-sandbox.log"
          key=kernel.apparmor_restrict_unprivileged_userns
          : > "$log"
          # Small /dev/shm is the other known Chrome-startup failure on hosted
          # VMs; record both host facts so a failure names the cause.
          { df -h /dev/shm || true; } | tee -a "$log"
          clone=/proc/sys/kernel/unprivileged_userns_clone
          if [ -r "$clone" ]; then
            echo "unprivileged_userns_clone: $(cat "$clone")" | tee -a "$log"
          else
            echo "unprivileged_userns_clone: absent" | tee -a "$log"
          fi
          state=$(sysctl -n "$key" 2>/dev/null || true)
          if [ -z "$state" ]; then
            echo "$key: absent (host does not restrict unprivileged user namespaces)" | tee -a "$log"
          else
            echo "$key: $state before" | tee -a "$log"
            if [ "$state" != "0" ]; then
              sudo sysctl -w "$key=0" | tee -a "$log"
              state=$(sysctl -n "$key")
              echo "$key: $state after" | tee -a "$log"
              if [ "$state" != "0" ]; then
                echo "cannot relax $key; Chrome's sandbox cannot start" >&2
                exit 1
              fi
            fi
          fi
          # Prove the sandboxed shell actually launches before the gate spends
          # minutes building images against a broken host.
          profile=$(mktemp -d "$RUNNER_TEMP/chrome-sandbox-check.XXXXXX")
          trap 'rm -rf "$profile"' EXIT
          "$TITAN_CHROME" --headless --disable-gpu --no-first-run \
            --no-default-browser-check --user-data-dir="$profile" \
            --dump-dom 'data:text/html,<p id=sandbox>ok</p>' \
            2>&1 | tee -a "$log"
          grep -q 'id="sandbox"' "$log"

      - name: Install the fork's browser Lua into the validation prefix
        run: |
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          make lua-browser PREFIX="$PREFIX"
          for installed in liblua.a liblua-config.txt \
              include/lua.h include/luaconf.h include/lstate.h; do
            test -f "$PREFIX/lib/browser/$installed"
          done

      # The rockspec builds the native runtime and stdlib. Emscripten must not
      # be visible here, so this step proves the browser toolchain stays out of
      # the ordinary native build.
      - name: Install the native runtime and compiler with LuaRocks (no Emscripten)
        run: |
          test -z "${EMSDK:-}"
          ! command -v emcc >/dev/null 2>&1
          # The prepared tree keeps unregistered compiler copies. LuaRocks would
          # move them aside as "~" backups instead of installing this commit, so
          # remove only those three preparation paths, exactly as the
          # native-coverage job does.
          rm -f "$PREFIX/bin/titanc"
          rm -rf "$PREFIX/share/lua/5.5/titan-compiler"
          rm -rf "$PREFIX/share/lua/5.5/c-parser"
          "$PREFIX/bin/luarocks" make

      - name: Build and install the browser SDK
        run: |
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          test -z "$(ls -A "$PREFIX/lib/titan-browser" 2>/dev/null || true)"
          make browser-sdk PREFIX="$PREFIX"
          for installed in libtitan.a titan.a titan-browser.mjs \
              titan-browser-library.js titan-browser-trace.js \
              titan-browser-run titan-browser-run.mjs \
              titan-browser-node-worker.mjs titan-browser-page.mjs sdk-digests; do
            test -f "$PREFIX/lib/titan-browser/0.6/$installed"
          done


      - name: Run the browser real-toolchain gate
        env:
          TITAN_ROOT: ${{ github.workspace }}/.lua
          TITAN_REQUIRE_BROWSER_TOOLCHAIN: "1"
          TITAN_PROBE_CACHE_DISABLE: "1"
        run: |
          set -euo pipefail
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          gate_specs=(
            spec/wasm_toolchain_spec.lua
            spec/coder/browser_toolchain_spec.lua
            spec/browser_trace_map_spec.lua
            spec/coder/browser_trace_entries_spec.lua
            spec/coder/browser_budgets_spec.lua
          )
          for gate_spec in "${gate_specs[@]}"; do
            if [[ ! -f $gate_spec ]]; then
              echo "missing browser real-toolchain spec: $gate_spec" >&2
              exit 1
            fi
          done
          "$PREFIX/bin/busted" -c -o gtest -v "${gate_specs[@]}" \
            2>&1 | tee "$RUNNER_TEMP/browser-gate.log"

      # Each browser job contributes the compiler paths exercised by its specs,
      # independently of the emsdk-free compiler shards.
      - name: Generate browser coverage report
        run: |
          set -euo pipefail
          luacov "titan%-compiler/" "titanc$"
          grep "Summary" -B1 -A1000 luacov.report.out
          lua spec/support/prepare_codecov_report.lua \
            luacov.report.out luacov.codecov.out

      - name: Upload browser coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./luacov.codecov.out
          flags: compiler
          name: browser
          use_oidc: true

      - name: Build the browser runner images
        run: |
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          output="$GITHUB_WORKSPACE/out/browser/runner"
          mkdir -p "$output"
          "$PREFIX/bin/titanc" -q --target browser --test \
            --tree spec/browser -o "$output" \
            --exe "$output/runner_image.mjs" runner_image
          "$PREFIX/bin/titanc" -q --target browser \
            --tree spec/browser -o "$output" \
            --exe "$output/runner_status.mjs" runner_status
          echo "TITAN_BROWSER_RUNNER_IMAGE=$output/runner_image.mjs" >> "$GITHUB_ENV"
          echo "TITAN_BROWSER_RUNNER_STATUS_IMAGE=$output/runner_status.mjs" >> "$GITHUB_ENV"
          echo "TITAN_BROWSER_RUNNER=$PREFIX/lib/titan-browser/0.6/titan-browser-run" >> "$GITHUB_ENV"
          for image in runner_image runner_status; do
            test -f "$output/$image.mjs"
            test -f "$output/$image.wasm"
            test -f "$output/$image.wasm.map"
          done

      # The loader suite takes image paths relative to --root, so every fixture
      # is built into one isolated root: loader_app and fidelity as programs,
      # loader_names as a test image, each at both assertion profiles.
      - name: Build the portable loader images for both assertion profiles
        run: |
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          root="$GITHUB_WORKSPACE/out/browser/loader"
          for assertions in 2 0; do
            output="$root/assertions-$assertions"
            mkdir -p "$output"
            preamble="package.path='$GITHUB_WORKSPACE/?.lua;$GITHUB_WORKSPACE/?/init.lua;'..package.path; require('titan-compiler.driver').browser_link_options={purpose='program',assertions=$assertions}"
            # A --test build is a test image and must link with the test
            # profile, never the program profile.
            test_preamble="package.path='$GITHUB_WORKSPACE/?.lua;$GITHUB_WORKSPACE/?/init.lua;'..package.path; require('titan-compiler.driver').browser_link_options={purpose='test',assertions=$assertions}"
            for module in loader_app fidelity; do
              TITAN_ROOT="$PREFIX" "$PREFIX/bin/lua" -E -e "$preamble" \
                "$GITHUB_WORKSPACE/titanc" -q --target browser --no-uv-bootstrap \
                --tree spec/fixtures/browser_loader -o "$output" \
                --exe "$output/$module.mjs" \
                --c-source spec/fixtures/browser_loader/loader.c "$module"
            done
            TITAN_ROOT="$PREFIX" "$PREFIX/bin/lua" -E -e "$test_preamble" \
              "$GITHUB_WORKSPACE/titanc" -q --target browser --test --no-uv-bootstrap \
              --tree spec/fixtures/browser_loader -o "$output" \
              --exe "$output/loader_names.mjs" loader_names
            for image in loader_app fidelity loader_names; do
              test -f "$output/$image.mjs"
              test -f "$output/$image.wasm"
              test -f "$output/$image.wasm.map"
            done
          done
          # Exercise the guard in an optimized, assertions-off measurement
          # image; correctness must not depend on debug assertions.
          optimized="$root/optimized"
          mkdir -p "$optimized"
          # Emscripten 6.0.13 excludes JSPI from import/export minification.
          # Keep the shrink control, but assert stable exported names rather
          # than claiming this JSPI image exercised minified names.
          TITAN_ROOT="$PREFIX" "$PREFIX/bin/lua" -E -e \
            "package.path='$GITHUB_WORKSPACE/?.lua;$GITHUB_WORKSPACE/?/init.lua;'..package.path; require('titan-compiler.driver').browser_link_options={purpose='baseline',optimization='O2',assertions=0}" \
            "$GITHUB_WORKSPACE/titanc" -q --target browser --incremental --no-uv-bootstrap \
            --ldflag=-Os \
            --tree spec/fixtures/browser_loader -o "$optimized" \
            --exe "$optimized/fidelity.mjs" \
            --c-source spec/fixtures/browser_loader/loader.c fidelity
          test -f "$optimized/fidelity.mjs"
          test -f "$optimized/fidelity.wasm"
          test -f "$optimized/fidelity.wasm.map"

      - name: Run the portable loader suite under Node and Chromium
        run: |
          set -euo pipefail
          runner="$PREFIX/lib/titan-browser/0.6/titan-browser-run"
          # Image paths are slash-separated relative paths beneath --root, so the
          # suite is rooted at the workspace and never sees host absolute paths.
          images=(
            out/browser/loader/assertions-2/loader_app.mjs
            out/browser/loader/assertions-0/loader_app.mjs
            --fidelity
            out/browser/loader/assertions-2/fidelity.mjs
            out/browser/loader/assertions-0/fidelity.mjs
            --names
            out/browser/loader/assertions-2/loader_names.mjs
            out/browser/loader/assertions-0/loader_names.mjs
          )
          for engine in node chromium; do
            echo "loader suite: $engine"
            "$runner" --engine "$engine" --timeout 300000 --grace 2000 \
              --root "$GITHUB_WORKSPACE" \
              --js-test spec/browser/loader.test.mjs -- "${images[@]}" \
              2>&1 | tee -a "$RUNNER_TEMP/browser-loader.log"
          done

      - name: Run the optimized guard suite under Node and Chromium
        run: |
          set -euo pipefail
          runner="$PREFIX/lib/titan-browser/0.6/titan-browser-run"
          for engine in node chromium; do
            echo "optimized guard: $engine"
            "$runner" --engine "$engine" --timeout 300000 --grace 2000 \
              --root "$GITHUB_WORKSPACE" \
              --js-test spec/fixtures/browser_loader/optimized-guard.mjs -- \
              out/browser/loader/optimized/fidelity.mjs \
              2>&1 | tee -a "$RUNNER_TEMP/browser-guard.log"
          done

      - name: Run the browser runner supervisor suite
        env:
          TITAN_REQUIRE_BROWSER_TOOLCHAIN: "1"
          # The supervisor's containment case reuses the loader suite's fidelity
          # image instead of building a second copy.
          TITAN_BROWSER_LOADER_IMAGE: ${{ github.workspace }}/out/browser/loader/assertions-2/fidelity.mjs
        run: |
          set -euo pipefail
          "$TITAN_NODE" --test spec/browser/runner.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/browser-runner.log"

      - name: Run the browser trace adapter and supervisor units
        run: |
          set -euo pipefail
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          output="$GITHUB_WORKSPACE/out/browser/trace-adapter"
          mkdir -p "$output"
          trace_flags=(-std=c99 -O1 -fno-inline -fno-optimize-sibling-calls
            -gsource-map -g2 -sMODULARIZE=1 -sEXPORT_ES6=1
            -sENVIRONMENT=web,node -sALLOW_MEMORY_GROWTH=1 --no-entry
            --js-library titan-runtime/browser/titan-browser-trace.js)
          # The filter image compiles against the installed Lua archive, so its
          # macros are the installed record's, never a local list: the fork
          # changes them (LUAI_MAXCCALLS) and a mismatch is a different
          # configuration than the archive.
          lua_defines="$(sed -n 's/^lua_defines=//p' "$PREFIX/lib/browser/liblua-config.txt")"
          test -n "$lua_defines"
          for assertions in 2 0; do
            emcc "${trace_flags[@]}" -sASSERTIONS="$assertions" \
              -sEXPORTED_FUNCTIONS='["_trace_capture_once","_titan_browser_trace_identity"]' \
              -Ititan-runtime/browser spec/fixtures/browser_trace_adapter/lifecycle.c \
              -o "$output/lifecycle-$assertions.mjs"
            emcc "${trace_flags[@]}" -sASSERTIONS="$assertions" \
              -Wall -Wno-unused-function -DTITAN_TARGET_BROWSER=1 \
              -DTITAN_COROUTINE_STACK_SIZE=262144 \
              $lua_defines -sSUPPORT_LONGJMP=wasm -sWASM_LEGACY_EXCEPTIONS=1 \
              -sEXPORTED_FUNCTIONS='["_trace_filter_case","_trace_filter_status","_titan_browser_trace_identity"]' \
              -sEXPORTED_RUNTIME_METHODS='["HEAPU8"]' \
              -I"$PREFIX/lib/browser/include" -Ititan-runtime -I"$PREFIX/include" \
              spec/fixtures/browser_trace_adapter/filter.c titan-runtime/titan.c \
              "$PREFIX/lib/browser/liblua.a" -o "$output/filter-$assertions.mjs"
            TITAN_BROWSER_TRACE_LIFECYCLE_IMAGE="$output/lifecycle-$assertions.mjs" \
              TITAN_BROWSER_TRACE_FILTER_IMAGE="$output/filter-$assertions.mjs" \
              "$TITAN_NODE" --test spec/browser/trace-adapter.test.mjs \
              spec/browser/playwright-runner.test.mjs \
              2>&1 | tee -a "$RUNNER_TEMP/browser-trace-units.log"
          done

      - name: Build and run the browser trace gate under Node
        env:
          TITAN_ROOT: ${{ github.workspace }}/.lua
        run: |
          set -euo pipefail
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          output="$GITHUB_WORKSPACE/out/browser/trace-node"
          runner="$PREFIX/lib/titan-browser/0.6/titan-browser-run"
          lua -E spec/browser/build-trace.lua "$output" \
            2>&1 | tee "$RUNNER_TEMP/browser-trace-build.log"
          "$runner" --engine node --timeout 300000 --grace 2000 \
            --root "$output" --js-test "$output/trace.test.mjs" \
            2>&1 | tee "$RUNNER_TEMP/browser-trace-node.log"
          TITAN_TRACE_OUTPUT="$output" TITAN_TRACE_RUNNER="$runner" \
            "$TITAN_NODE" --input-type=module <<'JS' \
            2>&1 | tee "$RUNNER_TEMP/browser-trace-node-policy.log"
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {resolve} from 'node:path';
          const root = process.env.TITAN_TRACE_OUTPUT;
          const manifest = JSON.parse(readFileSync(resolve(root, 'manifest.json'), 'utf8'));
          if (!manifest.degradedCases?.length) throw new Error('missing degraded trace cases');
          for (const row of manifest.degradedCases) {
            const result = spawnSync(process.env.TITAN_TRACE_RUNNER,
              ['--engine', 'node', '--timeout', '60000', '--root', root,
               resolve(root, row.image)], {stdio: 'inherit', timeout: 90000});
            if (result.error || result.status !== 75)
              throw new Error(`${row.name}: degraded trace was not a harness failure (${result.status})`);
          }
          JS
          "$runner" --engine node --timeout 300000 --grace 2000 \
            --allow-degraded-trace --root "$output" \
            --js-test "$output/trace.test.mjs" -- --degraded \
            2>&1 | tee "$RUNNER_TEMP/browser-trace-node-degraded.log"

      - name: Upload browser failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-toolchain-failure
          path: |
            ${{ runner.temp }}/browser-*.log
            out/browser
          if-no-files-found: warn
          retention-days: 7

  # The SDK/stdlib integration gate balances the budget and JavaScript suites
  # above without sharing a mutable prefix or depending on that sibling job.
  # Implementation notes: doc/implementation/continuous-integration.md#linux-job-graph-and-concurrency
  browser-stdlib:
    name: browser SDK and core stdlib (ubuntu-24.04, emsdk 6.0.13, Node 26)
    needs: build-compiler
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    permissions:
      contents: read
      # The browser gate uploads its own compiler coverage report.
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MAKEFLAGS: "-j4"
      TITAN_JOBS: "4"
      # emsdk_env.sh unsets every EMSDK_* input it does not set itself, so the
      # pin and the installation root must not use that prefix.
      TITAN_EMSDK_VERSION: "6.0.13"
      TITAN_EMSDK_ROOT: ${{ github.workspace }}/.emsdk
      TITAN_NODE_VERSION: "26.13.0"
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua
      # Chrome for Testing 156.0.8078.80, the version verified for #329. The
      # ZIP digest is pinned because CfT publishes no .sha256 sidecar.
      TITAN_CHROME_VERSION: "156.0.8078.80"
      TITAN_CHROME_SHA256: "547dcd374e02961bf998f6046a267644f8502225c36bb78ca307dab32a0b3eb4"
      TITAN_CHROME_ROOT: ${{ github.workspace }}/.chrome

    steps:
      - uses: actions/checkout@v6
        with:
          # The fork's install-browser reads the gitlink revision from the
          # submodule checkout to write the build record.
          submodules: true

      - name: Download prepared Linux tree
        uses: actions/download-artifact@v8
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}

      - name: Restore prepared Linux tree and environment
        run: |
          tar -xzf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" \
            -C "$GITHUB_WORKSPACE"
          test "$(cat .ci-prepared-workspace)" = "$GITHUB_WORKSPACE"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          .lua/bin/lua -v

      - name: Restore the pinned Emscripten SDK
        uses: ubicloud/cache@v4
        with:
          path: ${{ github.workspace }}/.emsdk
          key: ubuntu-24.04-${{ runner.arch }}-emsdk-${{ env.TITAN_EMSDK_VERSION }}-v1
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-emsdk-${{ env.TITAN_EMSDK_VERSION }}-

      - name: Install Emscripten ${{ env.TITAN_EMSDK_VERSION }}
        run: |
          if [ ! -x "$TITAN_EMSDK_ROOT/emsdk" ]; then
            # The clone is the installer, not the pin: the pin is the release
            # tag that install activates and the record names.
            rm -rf "$TITAN_EMSDK_ROOT"
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git \
              "$TITAN_EMSDK_ROOT"
          fi
          # Both commands are idempotent, so a restored installation only
          # verifies the pinned version instead of downloading it again.
          "$TITAN_EMSDK_ROOT/emsdk" install "$TITAN_EMSDK_VERSION"
          "$TITAN_EMSDK_ROOT/emsdk" activate "$TITAN_EMSDK_VERSION"
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          emcc --version | head -n 1
          installed=$(emcc --version |
            sed -n 's/.*) \([0-9][0-9.]*\).*/\1/p' | head -n 1)
          test "$installed" = "$TITAN_EMSDK_VERSION"

      # The Emscripten SDK still bundles Node 24 for its own tools. Browser
      # images use the separately pinned, unflagged JSPI runtime.
      - name: Install the pinned Node 26 runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.TITAN_NODE_VERSION }}

      - name: Select and qualify Node 26
        run: |
          node_bin=$(command -v node)
          version=$("$node_bin" --version)
          test "$version" = "v$TITAN_NODE_VERSION"
          "$node_bin" -e 'if (typeof WebAssembly.promising !== "function" || typeof WebAssembly.Suspending !== "function") throw new Error("Node requires unflagged JSPI")'
          echo "TITAN_NODE=$node_bin" >> "$GITHUB_ENV"
          "$node_bin" --version

      - name: Restore the pinned Chrome for Testing headless shell
        uses: ubicloud/cache@v4
        with:
          path: ${{ env.TITAN_CHROME_ROOT }}
          # The digest is part of the identity: re-pinning the same version to a
          # different ZIP must never restore the previous binary.
          key: ubuntu-24.04-${{ runner.arch }}-chrome-headless-shell-${{ env.TITAN_CHROME_VERSION }}-${{ env.TITAN_CHROME_SHA256 }}-v1

      # act has no browser, so the executable and its runtime libraries are
      # provisioned here rather than assumed from the runner image.
      - name: Install Chrome for Testing headless shell ${{ env.TITAN_CHROME_VERSION }}
        run: |
          set -euo pipefail
          chrome="$TITAN_CHROME_ROOT/chrome-headless-shell-linux64/chrome-headless-shell"
          if [ ! -x "$chrome" ]; then
            archive="$RUNNER_TEMP/chrome-headless-shell-$TITAN_CHROME_VERSION.zip"
            curl -fsSL -o "$archive" \
              "https://storage.googleapis.com/chrome-for-testing-public/$TITAN_CHROME_VERSION/linux64/chrome-headless-shell-linux64.zip"
            echo "$TITAN_CHROME_SHA256  $archive" | sha256sum -c --strict -
            rm -rf "$TITAN_CHROME_ROOT"
            mkdir -p "$TITAN_CHROME_ROOT"
            # Python's zipfile writes members with the process umask; the helper
            # restores each recorded Unix mode, including the shell's +x bit.
            python3 scripts/browser_extract_zip.py "$archive" "$TITAN_CHROME_ROOT"
            rm -f "$archive"
          fi
          test -x "$chrome"
          if ! ldd "$chrome" | grep -q "not found"; then
            echo "Chrome for Testing runtime libraries are present"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
              libatspi2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 \
              libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
              libpango-1.0-0 libcairo2 libasound2t64 libxshmfence1 \
              fonts-liberation
          fi
          if ldd "$chrome" | grep -q "not found"; then
            echo "missing Chrome for Testing runtime libraries:" >&2
            ldd "$chrome" | grep "not found" >&2
            exit 1
          fi
          echo "TITAN_CHROME=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version

      # CfT 156 gives sandboxed renderers an 8 GiB RLIMIT_DATA on <=16 GiB
      # hosts, but protobuf startup needs 13-14 GiB (D22). Double that
      # renderer limit with Chrome's feature, without disabling the sandbox.
      # GetProcessDataSizeLimit:
      # https://chromium.googlesource.com/chromium/src/+/refs/tags/156.0.8078.80/sandbox/policy/linux/sandbox_linux.cc
      - name: Raise the browser stdlib renderer data limit
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/titan-stdlib-chrome"
          printf '#!/usr/bin/env bash\nexec %q --enable-features=HigherRendererMemoryLimit "$@"\n' \
            "$TITAN_CHROME" > "$wrapper"
          chmod +x "$wrapper"
          echo "TITAN_CHROME=$wrapper" >> "$GITHUB_ENV"

      # Ubuntu 24.04 enables kernel.apparmor_restrict_unprivileged_userns by
      # default, which kills Chrome's user-namespace sandbox before CDP can
      # attach ("CDP pipe closed before shutdown"). Chrome keeps its sandbox:
      # this only relaxes the host restriction, and only when it is present.
      - name: Allow Chrome's user-namespace sandbox on the CI host
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/browser-chrome-sandbox.log"
          key=kernel.apparmor_restrict_unprivileged_userns
          : > "$log"
          # Small /dev/shm is the other known Chrome-startup failure on hosted
          # VMs; record both host facts so a failure names the cause.
          { df -h /dev/shm || true; } | tee -a "$log"
          clone=/proc/sys/kernel/unprivileged_userns_clone
          if [ -r "$clone" ]; then
            echo "unprivileged_userns_clone: $(cat "$clone")" | tee -a "$log"
          else
            echo "unprivileged_userns_clone: absent" | tee -a "$log"
          fi
          state=$(sysctl -n "$key" 2>/dev/null || true)
          if [ -z "$state" ]; then
            echo "$key: absent (host does not restrict unprivileged user namespaces)" | tee -a "$log"
          else
            echo "$key: $state before" | tee -a "$log"
            if [ "$state" != "0" ]; then
              sudo sysctl -w "$key=0" | tee -a "$log"
              state=$(sysctl -n "$key")
              echo "$key: $state after" | tee -a "$log"
              if [ "$state" != "0" ]; then
                echo "cannot relax $key; Chrome's sandbox cannot start" >&2
                exit 1
              fi
            fi
          fi
          # Prove the sandboxed shell actually launches before the gate spends
          # minutes building images against a broken host.
          profile=$(mktemp -d "$RUNNER_TEMP/chrome-sandbox-check.XXXXXX")
          trap 'rm -rf "$profile"' EXIT
          "$TITAN_CHROME" --headless --disable-gpu --no-first-run \
            --no-default-browser-check --user-data-dir="$profile" \
            --dump-dom 'data:text/html,<p id=sandbox>ok</p>' \
            2>&1 | tee -a "$log"
          grep -q 'id="sandbox"' "$log"

      - name: Install the fork's browser Lua into the validation prefix
        run: |
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          make lua-browser PREFIX="$PREFIX"
          for installed in liblua.a liblua-config.txt \
              include/lua.h include/luaconf.h include/lstate.h; do
            test -f "$PREFIX/lib/browser/$installed"
          done

      # The rockspec builds the native runtime and stdlib. Emscripten must not
      # be visible here, so this step proves the browser toolchain stays out of
      # the ordinary native build.
      - name: Install the native runtime and compiler with LuaRocks (no Emscripten)
        run: |
          test -z "${EMSDK:-}"
          ! command -v emcc >/dev/null 2>&1
          # The prepared tree keeps unregistered compiler copies. LuaRocks would
          # move them aside as "~" backups instead of installing this commit, so
          # remove only those three preparation paths, exactly as the
          # native-coverage job does.
          rm -f "$PREFIX/bin/titanc"
          rm -rf "$PREFIX/share/lua/5.5/titan-compiler"
          rm -rf "$PREFIX/share/lua/5.5/c-parser"
          "$PREFIX/bin/luarocks" make

      - name: Build and install the browser SDK
        run: |
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          test -z "$(ls -A "$PREFIX/lib/titan-browser" 2>/dev/null || true)"
          make browser-sdk PREFIX="$PREFIX"
          for installed in libtitan.a titan.a titan-browser.mjs \
              titan-browser-library.js titan-browser-trace.js \
              titan-browser-run titan-browser-run.mjs \
              titan-browser-node-worker.mjs titan-browser-page.mjs sdk-digests; do
            test -f "$PREFIX/lib/titan-browser/0.6/$installed"
          done

      - name: Run partitioned browser core stdlib suite under Node and Chromium
        run: |
          set -euo pipefail
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          make titan-stdlib-browser-test PREFIX="$PREFIX" \
            2>&1 | tee "$RUNNER_TEMP/browser-stdlib.log"

      - name: Run the browser SDK and stdlib real-toolchain gate
        env:
          TITAN_ROOT: ${{ github.workspace }}/.lua
          TITAN_REQUIRE_BROWSER_TOOLCHAIN: "1"
          TITAN_PROBE_CACHE_DISABLE: "1"
        run: |
          set -euo pipefail
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          gate_specs=(
            spec/coder/browser_providers_spec.lua
            spec/coder/browser_incremental_spec.lua
            spec/coder/browser_images_spec.lua
            spec/coder/browser_protocol_spec.lua
            spec/browser_sdk_spec.lua
            spec/coder/browser_stdlib_closure_spec.lua
            spec/coder/browser_entry_gate_spec.lua
            spec/coder/browser_stdlib_gate_spec.lua
            spec/coder/browser_fixtures_spec.lua
            spec/minicoro_spec.lua
          )
          for gate_spec in "${gate_specs[@]}"; do
            if [[ ! -f $gate_spec ]]; then
              echo "missing browser real-toolchain spec: $gate_spec" >&2
              exit 1
            fi
          done
          "$PREFIX/bin/busted" -c -o gtest -v "${gate_specs[@]}" \
            2>&1 | tee "$RUNNER_TEMP/browser-stdlib-gate.log"

      - name: Generate browser SDK and stdlib coverage report
        run: |
          set -euo pipefail
          luacov "titan%-compiler/" "titanc$"
          grep "Summary" -B1 -A1000 luacov.report.out
          lua spec/support/prepare_codecov_report.lua \
            luacov.report.out luacov.codecov.out

      - name: Upload browser SDK and stdlib coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./luacov.codecov.out
          flags: compiler
          name: browser-stdlib
          use_oidc: true

      - name: Upload browser SDK and stdlib failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-stdlib-failure
          path: |
            ${{ runner.temp }}/browser-*.log
            out/browser-stdlib/*.log
            out/browser-stdlib/images/*.mjs
            out/browser-stdlib/images/*.wasm
            out/browser-stdlib/images/*.wasm.map
            out/browser-stdlib/*roots.txt
            out/browser-stdlib/members.md
          if-no-files-found: warn
          retention-days: 7

  # The same native Titan fixture images run in all three managed engines.
  # Each matrix cell owns its prefix, browser installation and output tree;
  # assertions 2 and 0 are both built by the portable trace-gate builder.
  browser-playwright:
    name: browser traces (${{ matrix.profile }}, ${{ matrix.engine }}, Playwright 1.64.1)
    needs: build-compiler
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: [validation, production]
        engine: [chromium, firefox, webkit]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MAKEFLAGS: "-j4"
      TITAN_JOBS: "4"
      TITAN_BUILD_PROFILE: ${{ matrix.profile }}
      CC: gcc-14
      LUA_CC: gcc-14
      TITAN_EMSDK_VERSION: "6.0.13"
      TITAN_EMSDK_ROOT: ${{ github.workspace }}/.emsdk
      TITAN_NODE_VERSION: "26.13.0"
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua
      TITAN_ROOT: ${{ github.workspace }}/.lua
      TITAN_PLAYWRIGHT_VERSION: "1.64.1"
      TITAN_PLAYWRIGHT_ROOT: ${{ github.workspace }}/out/playwright-tools
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      TITAN_TRACE_ENGINE: ${{ matrix.engine }}
      TITAN_TRACE_OUTPUT: ${{ github.workspace }}/out/browser/trace-${{ matrix.profile }}-${{ matrix.engine }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download prepared Linux tree
        if: matrix.profile == 'validation'
        uses: actions/download-artifact@v8
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}

      - name: Restore prepared Linux tree and environment
        if: matrix.profile == 'validation'
        run: |
          tar -xzf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" -C "$GITHUB_WORKSPACE"
          test "$(cat .ci-prepared-workspace)" = "$GITHUB_WORKSPACE"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          .lua/bin/lua -v

      - name: Install native compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-14 curl libreadline-dev

      # Prepared compiler trees contain validation-built authored runtime
      # objects. Make does not stamp their flags, so production starts cold
      # rather than relabeling that SDK or deleting its outputs.
      - name: Bootstrap an independent production prefix
        if: matrix.profile == 'production'
        run: |
          set -euo pipefail
          test ! -e .ci-prepared-workspace
          test ! -e "$PREFIX" && test ! -L "$PREFIX"
          make lua luarocks
          export PATH="$PREFIX/bin:$PATH"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          "$PREFIX/bin/lua" -v
          "$PREFIX/bin/luarocks" make --only-deps
          "$PREFIX/bin/luarocks" test --prepare
          LIBBT_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ianlancetaylor/libbacktrace.git" \
            make libbacktrace

      - name: Install the selected native compiler and SDK profile
        run: |
          test -z "${EMSDK:-}"
          ! command -v emcc >/dev/null 2>&1
          rm -f "$PREFIX/bin/titanc"
          rm -rf "$PREFIX/share/lua/5.5/titan-compiler"
          rm -rf "$PREFIX/share/lua/5.5/c-parser"
          "$PREFIX/bin/luarocks" make

      - name: Restore the pinned Emscripten SDK
        uses: ubicloud/cache@v4
        with:
          path: ${{ github.workspace }}/.emsdk
          key: ubuntu-24.04-${{ runner.arch }}-emsdk-${{ env.TITAN_EMSDK_VERSION }}-v1
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-emsdk-${{ env.TITAN_EMSDK_VERSION }}-

      - name: Install Emscripten
        run: |
          set -euo pipefail
          if [ ! -x "$TITAN_EMSDK_ROOT/emsdk" ]; then
            git -C "$GITHUB_WORKSPACE" clone --depth 1 \
              https://github.com/emscripten-core/emsdk.git "$TITAN_EMSDK_ROOT"
          fi
          "$TITAN_EMSDK_ROOT/emsdk" install "$TITAN_EMSDK_VERSION"
          "$TITAN_EMSDK_ROOT/emsdk" activate "$TITAN_EMSDK_VERSION"
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          emcc --version
          emcc --version | grep -q " $TITAN_EMSDK_VERSION "

      - name: Install the pinned Node 26 runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.TITAN_NODE_VERSION }}

      - name: Select and qualify Node 26
        run: |
          node_bin=$(command -v node)
          version=$("$node_bin" --version)
          test "$version" = "v$TITAN_NODE_VERSION"
          "$node_bin" -e 'if (typeof WebAssembly.promising !== "function" || typeof WebAssembly.Suspending !== "function") throw new Error("Node requires unflagged JSPI")'
          echo "TITAN_NODE=$node_bin" >> "$GITHUB_ENV"
          "$node_bin" --version

      - name: Install browser Lua and SDK
        run: |
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          make lua-browser PREFIX="$PREFIX"
          make browser-sdk PREFIX="$PREFIX"
          test -f "$PREFIX/lib/titan-browser/0.6/titan-browser-trace.js"

      - name: Restore Playwright-managed browsers
        uses: ubicloud/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ubuntu-24.04-${{ runner.arch }}-playwright-${{ env.TITAN_PLAYWRIGHT_VERSION }}-${{ matrix.engine }}-v1

      - name: Install the pinned Playwright engine and runtime dependencies
        run: |
          set -euo pipefail
          npm install --prefix "$TITAN_PLAYWRIGHT_ROOT" --no-save \
            --package-lock=false --no-audit --no-fund \
            "playwright@$TITAN_PLAYWRIGHT_VERSION"
          "$TITAN_NODE" "$TITAN_PLAYWRIGHT_ROOT/node_modules/playwright/cli.js" \
            install --with-deps "$TITAN_TRACE_ENGINE"

      - name: Exercise the Playwright supervisor on this managed engine
        run: |
          set -euo pipefail
          TITAN_PLAYWRIGHT_TEST_ENGINES="$TITAN_TRACE_ENGINE" \
            "$TITAN_NODE" --test spec/browser/playwright-runner.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-supervisor.log"

      - name: Build the portable trace gate for both assertion modes
        run: |
          set -euo pipefail
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          lua -E spec/browser/build-trace.lua "$TITAN_TRACE_OUTPUT" \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-build.log"

      - name: Run full Chromium and Firefox or reduced-fidelity WebKit traces
        run: |
          set -euo pipefail
          "$TITAN_NODE" spec/browser/playwright-run.mjs \
            --engine "$TITAN_TRACE_ENGINE" --timeout 300000 --grace 2000 \
            --sdk "$PREFIX/lib/titan-browser/0.6" --root "$TITAN_TRACE_OUTPUT" \
            "$TITAN_TRACE_OUTPUT/trace.test.mjs" \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-trace.log"

      - name: Require explicit degraded-mode opt-in and preserve original failures
        run: |
          set -euo pipefail
          "$TITAN_NODE" --input-type=module <<'JS' \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-policy.log"
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {resolve} from 'node:path';
          const root = process.env.TITAN_TRACE_OUTPUT;
          const manifest = JSON.parse(readFileSync(resolve(root, 'manifest.json'), 'utf8'));
          if (!manifest.degradedCases?.length) throw new Error('missing degraded trace cases');
          for (const row of manifest.degradedCases) {
            const result = spawnSync(process.execPath,
              ['spec/browser/playwright-run.mjs', '--engine', process.env.TITAN_TRACE_ENGINE,
               '--timeout', '60000', '--sdk', resolve(process.env.PREFIX, 'lib/titan-browser/0.6'),
               '--root', root, '--image', resolve(root, row.image)],
              {stdio: 'inherit', timeout: 90000});
            if (result.error || result.status !== 75)
              throw new Error(`${row.name}: degraded trace was not a harness failure (${result.status})`);
          }
          JS
          "$TITAN_NODE" spec/browser/playwright-run.mjs \
            --engine "$TITAN_TRACE_ENGINE" --timeout 300000 --grace 2000 \
            --allow-degraded-trace --sdk "$PREFIX/lib/titan-browser/0.6" \
            --root "$TITAN_TRACE_OUTPUT" \
            "$TITAN_TRACE_OUTPUT/trace.test.mjs" -- --degraded \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-degraded.log"

      # A validation install cannot stand in for a production one: the
      # descriptor and SDK identity would disagree. This cell already owns a
      # production prefix, so the profile-dependent pins run here and nowhere
      # else, and are `pending` in every validation run by design.
      - name: Run the production-only browser pins
        if: matrix.profile == 'production' && matrix.engine == 'chromium'
        env:
          TITAN_REQUIRE_BROWSER_TOOLCHAIN: "1"
          TITAN_PROBE_CACHE_DISABLE: "1"
        run: |
          set -euo pipefail
          source "$TITAN_EMSDK_ROOT/emsdk_env.sh"
          "$PREFIX/bin/busted" -o gtest -v spec/coder/browser_images_spec.lua \
            --filter="keeps frame flags on test owners" \
            2>&1 | tee "$RUNNER_TEMP/browser-production-pins.log"

      # Node is the binding engine for the C-call limit, and the other Node
      # trace gate runs in a validation installation only.
      - name: Run the production trace gate on Node
        if: matrix.profile == 'production' && matrix.engine == 'chromium'
        run: |
          set -euo pipefail
          runner="$PREFIX/lib/titan-browser/0.6/titan-browser-run"
          "$runner" --engine node --timeout 300000 --grace 2000 \
            --root "$TITAN_TRACE_OUTPUT" --js-test "$TITAN_TRACE_OUTPUT/trace.test.mjs" \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-node-trace.log"
          TITAN_TRACE_OUTPUT="$TITAN_TRACE_OUTPUT" TITAN_TRACE_RUNNER="$runner" \
            "$TITAN_NODE" --input-type=module <<'JS' \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-node-policy.log"
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {resolve} from 'node:path';
          const root = process.env.TITAN_TRACE_OUTPUT;
          const manifest = JSON.parse(readFileSync(resolve(root, 'manifest.json'), 'utf8'));
          if (!manifest.degradedCases?.length) throw new Error('missing degraded trace cases');
          for (const row of manifest.degradedCases) {
            const result = spawnSync(process.env.TITAN_TRACE_RUNNER,
              ['--engine', 'node', '--timeout', '60000', '--root', root,
               resolve(root, row.image)], {stdio: 'inherit', timeout: 90000});
            if (result.error || result.status !== 75)
              throw new Error(`${row.name}: degraded trace was not a harness failure (${result.status})`);
          }
          JS
          "$runner" --engine node --timeout 300000 --grace 2000 \
            --allow-degraded-trace --root "$TITAN_TRACE_OUTPUT" \
            --js-test "$TITAN_TRACE_OUTPUT/trace.test.mjs" -- --degraded \
            2>&1 | tee "$RUNNER_TEMP/browser-playwright-node-degraded.log"

      - name: Upload Playwright trace receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-playwright-${{ matrix.profile }}-${{ matrix.engine }}
          path: |
            ${{ runner.temp }}/browser-playwright-*.log
            ${{ runner.temp }}/browser-production-pins.log
            ${{ env.TITAN_TRACE_OUTPUT }}
          if-no-files-found: error
          retention-days: 7

  native-coverage:
    name: stdlib build, tests and coverage (ubuntu-24.04, GCC 14)
    needs: build-compiler
    if: github.event_name == 'push'
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      MAKEFLAGS: "-j4"
      TITAN_JOBS: "4"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CC: gcc-14
      LUA_CC: gcc-14
      GCOV: gcov-14
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua
      LIBUV_VERSION: "1.53.0"
      # Bump when any CMake option that affects the cached archive changes.
      LIBUV_BUILD_PROFILE: "static-pic-validation-tests-off-v3"
      LLHTTP_VERSION: "9.4.3"
      LLHTTP_SHA256: "1eb813c7437b31a87496a1cd3ed79f00746720f5e7e29c79b42c02cb69f36c39"
      LLHTTP_BUILD_PROFILE: "static-pic-hidden-c99-v1"
      SQLITE3_VERSION: "3.53.4"
      SQLITE3_RELEASE: "3530400"
      SQLITE3_SHA256: "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"
      SQLITE3_BUILD_PROFILE: "static-pic-hidden-c99-threadsafe1-v1"
      OPENSSL_VERSION: "3.5.7"
      OPENSSL_SHA256: "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"
      OPENSSL_BUILD_PROFILE: "static-pic-hidden-minimal-v1"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install stdlib build and coverage dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-14 clang-format python3-venv cmake curl libreadline-dev libssl-dev perl pkg-config

      - name: Download prepared Linux tree
        uses: actions/download-artifact@v8
        with:
          name: titan-linux-prepared.tar.gz
          path: ${{ runner.temp }}

      - name: Restore prepared tree and pinned reporter
        run: |
          tar -xzf "$RUNNER_TEMP/titan-linux-prepared.tar.gz" -C "$GITHUB_WORKSPACE"
          test "$(cat .ci-prepared-workspace)" = "$GITHUB_WORKSPACE"
          echo "$PWD/.lua/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/titan-coverage-tools"
          "$RUNNER_TEMP/titan-coverage-tools/bin/pip" install -r scripts/titan-coverage-requirements.txt
          clang-format --version

      - name: Cache bundled libuv source and static build
        uses: ubicloud/cache@v4
        with:
          path: |
            libuv-v${{ env.LIBUV_VERSION }}
            libuv-v${{ env.LIBUV_VERSION }}.tar.gz
            libuv-build
          key: ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-libuv-${{ env.LIBUV_VERSION }}-${{ env.LIBUV_BUILD_PROFILE }}-${{ hashFiles('vendor/libuv/*.patch') }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-libuv-${{ env.LIBUV_VERSION }}-${{ env.LIBUV_BUILD_PROFILE }}-

      - name: Cache bundled llhttp source and static build
        uses: ubicloud/cache@v4
        with:
          path: |
            llhttp-release-v${{ env.LLHTTP_VERSION }}
            llhttp-release-v${{ env.LLHTTP_VERSION }}.tar.gz
            llhttp-build
          key: ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-llhttp-${{ env.LLHTTP_VERSION }}-${{ env.LLHTTP_SHA256 }}-${{ env.LLHTTP_BUILD_PROFILE }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-llhttp-${{ env.LLHTTP_VERSION }}-${{ env.LLHTTP_SHA256 }}-

      - name: Cache bundled SQLite amalgamation and static build
        uses: ubicloud/cache@v4
        with:
          path: |
            sqlite-autoconf-${{ env.SQLITE3_RELEASE }}
            sqlite-autoconf-${{ env.SQLITE3_RELEASE }}.tar.gz
            sqlite3-build
          key: ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-sqlite3-${{ env.SQLITE3_VERSION }}-${{ env.SQLITE3_SHA256 }}-${{ env.SQLITE3_BUILD_PROFILE }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-sqlite3-${{ env.SQLITE3_VERSION }}-${{ env.SQLITE3_SHA256 }}-

      - name: Cache bundled OpenSSL source and static build
        uses: ubicloud/cache@v4
        with:
          path: |
            openssl-${{ env.OPENSSL_VERSION }}
            openssl-${{ env.OPENSSL_VERSION }}.tar.gz
            openssl-build
          key: ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-${{ env.OPENSSL_BUILD_PROFILE }}
          restore-keys: |
            ubuntu-24.04-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-gcc14-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_SHA256 }}-

      - name: Build the pinned bundled libuv
        run: make libuv

      - name: Build the pinned private llhttp support
        run: make llhttp

      - name: Build the pinned private SQLite support
        run: make sqlite3

      - name: Build the pinned bundled OpenSSL support
        run: make openssl

      - name: Restore regular Linux C-probe results
        id: regular-probe-cache
        uses: ubicloud/cache/restore@v4
        with:
          path: .lua/var/cache/titan-probes/2
          key: titan-probes-2-${{ runner.os }}-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-test-linux-stdlib-${{ github.sha }}
          restore-keys: |
            titan-probes-2-${{ runner.os }}-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-test-linux-stdlib-

      - name: Build and install the rock
        # Compiler preparation copied these files without a rock registration.
        # The source build uses its in-tree compiler; remove the temporary
        # copies before LuaRocks takes ownership, avoiding untracked backups.
        run: |
          rm -f "$PREFIX/bin/titanc"
          rm -rf "$PREFIX/share/lua/5.5/titan-compiler" \
            "$PREFIX/share/lua/5.5/c-parser"
          luarocks make --force
          provider="$PREFIX/lib/titan/0.6/titan.so"
          static_archive="${provider%.so}.a"
          runtime_archive="$PREFIX/lib/titan/0.6/libtitan.a"
          test -f "$provider" && test ! -L "$provider"
          test -f "$static_archive" && test ! -L "$static_archive"
          test -f "$runtime_archive" && test ! -L "$runtime_archive"
          test ! -e "$PREFIX/lib/libtitan.a"
          test ! -e "$PREFIX/share/titan/0.6/src/titan/test.titan"

      - name: Verify the support module and searcher-based stdlib loading
        run: |
          support="$PREFIX/lib/lua/5.5/titan.so"
          provider="$PREFIX/lib/titan/0.6/titan.so"
          test -f "$support" && test ! -e "$PREFIX/share/lua/5.5/titan"
          clean_lua() {
            env \
              -u LUA_PATH \
              -u LUA_CPATH \
              -u LUA_PATH_5_5 \
              -u LUA_CPATH_5_5 \
              -u LUA_INIT \
              -u LUA_INIT_5_5 \
              -u TITAN_PATH \
              -u TITAN_PATH_0_6 \
              -u TITAN_ROOT \
              "$PREFIX/bin/lua" -E "$@"
          }
          found=$(clean_lua -e 'io.write(assert(package.searchpath("titan", package.cpath)))')
          test "$found" -ef "$support"
          TITAN_STDLIB_PROVIDER="$provider" clean_lua -e '
            local provider = assert(os.getenv("TITAN_STDLIB_PROVIDER"))
            assert(package.loadlib(provider, "luaopen_titan") == nil,
              "the stdlib provider exports luaopen_titan")
            local titan = require "titan"
            assert(type(titan) == "table")
            assert(type(titan.backtrace) == "function")
            assert(type(titan._loadlibglobal) == "function")
            assert(type(require("titan.string").rep) == "function")
          '

      - name: Verify titanc shebang environment
        run: titanc --help

      # Packaging needs the ordinary installed provider. Run its host specs
      # here, then run the native behavior aggregate only with coverage below.
      - name: Run retained runtime and packaging specs
        env:
          TITAN_EXTRA_CFLAGS: "-O0 -fno-lto"
          TITAN_EXTRA_LDFLAGS: "-fno-lto"
          TITAN_TEST_EXTRA_CFLAGS: "-O0 -fno-lto"
          TITAN_TEST_EXTRA_LDFLAGS: "-fno-lto"
        run: make stdlib-busted-test EXTRA_TEST_FLAGS="-o gtest -v"

      # Two workers run the integrations concurrently, each in a private
      # extraction of the prepared tree with half of the job's -j4, sharing
      # this installed prefix and the host's /tmp temporary-file namespace;
      # the exclusive files then run alone. Their LuaCov stats merge into one
      # report.
      - name: Run compiler integrations that require the installed stdlib
        env:
          TITAN_EXTRA_CFLAGS: "-O0 -fno-lto"
          TITAN_EXTRA_LDFLAGS: "-fno-lto"
          TITAN_COVERAGE_TEST_CC: gcc-14
          TITAN_COVERAGE_TEST_GCOV: gcov-14
          TITAN_COVERAGE_TEST_GCOVR: ${{ runner.temp }}/titan-coverage-tools/bin/gcovr
          TITAN_COVERAGE_TEST_REQUIRED: "1"
        run: |
          bash spec/support/ci_stdlib_snapshot.sh save "$RUNNER_TEMP/titan-stdlib.tar"
          bash spec/support/ci_parallel_compiler_tests.sh stdlib
          bash spec/support/ci_stdlib_snapshot.sh restore "$RUNNER_TEMP/titan-stdlib.tar"
          luacov "titan%-compiler/" "titanc$"
          grep "Summary" -B1 -A1000 luacov.report.out
          lua spec/support/prepare_codecov_report.lua \
            luacov.report.out luacov.codecov.out
          grep -Fxq titanc.lua luacov.codecov.out

      - name: Build complete production stdlib inventory with coverage
        run: |
          make titan-native-coverage-build TITAN_COVERAGE_GCOV=gcov-14 \
            TITAN_COVERAGE_FORMATS='html lcov cobertura' \
            TITAN_COVERAGE_GCOVR="$RUNNER_TEMP/titan-coverage-tools/bin/gcovr"

      - name: Certify identical SDK reinstall without coverage compilation or linking
        run: |
          luarocks make --force
          log="$RUNNER_TEMP/titan-coverage-identical-reinstall.log"
          make titan-native-coverage-build TITAN_VERBOSE=1 TITAN_COVERAGE_GCOV=gcov-14 \
            TITAN_COVERAGE_FORMATS='html lcov cobertura' \
            TITAN_COVERAGE_GCOVR="$RUNNER_TEMP/titan-coverage-tools/bin/gcovr" 2>&1 | tee "$log"
          grep -Eq '^Titan object hit ' "$log"
          grep -Eq '^Titan native hit ' "$log"
          grep -Eq '^Titan link hit ' "$log"
          if grep -Eq '^Titan (object|native|link) miss |os_process_host_child[.]c' "$log"; then
            echo "Identical SDK reinstall compiled or linked native coverage artifacts" >&2
            exit 1
          fi

      - name: Run complete covered aggregate with fresh counters
        run: make titan-native-coverage-run

      - name: Build child-process smoke fixture
        run: |
          process_smoke_dir="$RUNNER_TEMP/titan-process-smoke"
          mkdir -p "$process_smoke_dir"
          TITAN_PROCESS_SMOKE_DIR="$process_smoke_dir" \
            .lua/bin/lua -e 'require("spec.support.os_test_support").process_child(assert(os.getenv("TITAN_PROCESS_SMOKE_DIR")))'
          echo "TITAN_PROCESS_SMOKE_CHILD=$process_smoke_dir/process_child" >> "$GITHUB_ENV"

      - name: Smoke-test bundled dependency source image
        # The following installed-rock canary owns the Linux system-mode build;
        # do not compile the same system OpenSSL image twice on this billed
        # runner.
        run: bash spec/support/ci_dependency_mode_smoke.sh bundled

      - name: Save regular Linux C-probe results
        uses: ubicloud/cache/save@v4
        with:
          path: .lua/var/cache/titan-probes/2
          key: ${{ steps.regular-probe-cache.outputs.cache-primary-key }}

      # The full behavior and packaging gates use the bundled provider. Only
      # the mode-dependent SDK/promotion cases and production smoke need a
      # system-OpenSSL reinstall.
      - name: Canary source-rock installation with system OpenSSL
        run: |
          make clean-stdlib
          OPENSSL_MODE=system TITAN_EXTRA_CFLAGS='-O0 -fno-lto' \
            TITAN_EXTRA_LDFLAGS=-fno-lto \
            luarocks make --force
          TITAN_EXPECT_OPENSSL_MODE=system \
            TITAN_PROBE_CACHE_DISABLE=1 \
            "$PREFIX/bin/busted" -o gtest -v spec/rockspec_spec.lua \
              --name='standalone-prefix source installation installs one matching Lua and Titan SDK before the standard images' \
              --name='standalone-prefix source installation loads direct libuv calls lazily for Titan and explicitly for Lua'
          OPENSSL_MODE=system \
            bash spec/support/ci_dependency_mode_smoke.sh system

      - name: Retain local reports and collection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: titan-native-line-coverage
          path: out/coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload stdlib compiler integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./luacov.codecov.out
          flags: compiler
          name: compiler-stdlib
          use_oidc: true

      - name: Upload native stdlib line coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: out/coverage/report/coverage.info
          flags: native-stdlib
          name: native-stdlib-lines
          use_oidc: true

  # Keep the focused native-memory release gate on one warm standard runner.
  # Full library behavior suites belong to regular Linux: recompiling them
  # under sanitizers consumes the runner budget without adding a distinct
  # lifetime boundary beyond these owner/callback tests and production smokes.
  sanitizer:
    name: sanitizer (ubuntu-24.04, ASan+UBSan)
    if: github.event_name == 'push'
    # Large instrumented test units need more than the two-vCPU runner's 8GB RAM.
    runs-on: ubicloud-standard-4
    timeout-minutes: 75
    env:
      MAKEFLAGS: "-j4"
      TITAN_JOBS: "4"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PREFIX: ${{ github.workspace }}/.lua
      TITAN_PREFIX: ${{ github.workspace }}/.lua
      # Native dependency caches stop at the pre-LuaRocks boundary. Bump the
      # schema when their build recipes or cached layout change.
      SANITIZER_NATIVE_CACHE_SCHEMA: "v4"
      CC: cc
      AR: ar
      RANLIB: ranlib
      SANITIZER_LUA_VERSION: "5.5.1"
      SANITIZER_LIBUV_VERSION: "1.53.0"
      SANITIZER_LIBUV_SHA256: "cb0d6dd2128d5a95bd242c6cc982a24fe608fa93da57b6b4ec763b0018c53e64"
      SANITIZER_LLHTTP_VERSION: "9.4.3"
      SANITIZER_LLHTTP_SHA256: "1eb813c7437b31a87496a1cd3ed79f00746720f5e7e29c79b42c02cb69f36c39"
      SANITIZER_SQLITE3_VERSION: "3.53.4"
      SANITIZER_SQLITE3_RELEASE: "3530400"
      SANITIZER_SQLITE3_SHA256: "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"
      SANITIZER_OPENSSL_VERSION: "3.5.7"
      SANITIZER_OPENSSL_SHA256: "a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8"
      # Generated Titan translation units are large enough that combining
      # optimization with sanitizer instrumentation can exhaust this job's
      # budget. O0 retains the complete ASan/UBSan instrumentation;
      # Lua and parser dependencies stay optimized; other native dependencies
      # remain at O0 below. Keep LTO off
      # so saved translation-unit bytes still match the diagnostic shadow.
      SANITIZER_FLAGS: "-O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      # Keep instrumentation in the job environment so recursive Make and
      # LuaRocks builds receive the same sanitizer flags throughout the job.
      LUA_MYCFLAGS: "-O1 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      LUA_MYLDFLAGS: "-O1 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      LUA_MYLIBS: "-O1 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      COMPILER_DEPS_CFLAGS: "-O1 -fno-lto -fPIC -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      COMPILER_DEPS_LDFLAGS: "-O1 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      LPEGLABEL_BUILD_CFLAGS: "-O1 -fno-lto"
      LIBBT_CFLAGS: "-fPIC -O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      LIBUV_BUILD_PROFILE: "static-pic-debug-tests-off-asan-ubsan-v2"
      LIBUV_BUILD_TYPE: Debug
      LIBUV_BUILD_CFLAGS: "-O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      LLHTTP_BUILD_CFLAGS: "-O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      SQLITE3_BUILD_CFLAGS: "-O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      OPENSSL_BUILD_CFLAGS: "-O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      OPENSSL_EXTRA_CONFIGURE_FLAGS: "no-asm"
      TITAN_EXTRA_CFLAGS: "-O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      TITAN_EXTRA_LDFLAGS: "-O0 -fno-lto -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      # Every Titan image intentionally embeds the vendored static Lua archive;
      # disable only ASan's cross-image ODR diagnostic for those duplicate Lua
      # globals. Address, bounds, lifetime, and leak checks remain enabled.
      ASAN_OPTIONS: "detect_odr_violation=0:detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1:abort_on_error=1:stack_trace_format='    #%n %p %F %S (%m+%o) %b'"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Free disk space for sanitizer links
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          # The disposable Linux runner includes an unused Android SDK. Keep
          # room for instrumented providers and the static child fixtures.
          if [[ -d /usr/local/lib/android/sdk && ! -L /usr/local/lib/android/sdk ]]; then
            sudo du -sh /usr/local/lib/android/sdk
            sudo rm -rf -- /usr/local/lib/android/sdk
          fi
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Configure sanitizer diagnostics
        run: |
          echo "TITAN_SANITIZER_LOG_DIR=$RUNNER_TEMP/titan-sanitizer-logs" \
            >> "$GITHUB_ENV"
          echo "TITAN_STDLIB_DIAGNOSTIC_SNAPSHOT=$RUNNER_TEMP/titan-sanitizer-snapshot" \
            >> "$GITHUB_ENV"

      - name: Install sanitizer build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake curl libreadline-dev perl

      - name: Identify sanitizer native dependency cache
        id: sanitizer-native-cache-key
        run: |
          libbacktrace_line="$(git ls-remote \
            https://github.com/ianlancetaylor/libbacktrace.git HEAD)"
          read -r libbacktrace_rev libbacktrace_ref <<< "$libbacktrace_line"
          [[ $libbacktrace_rev =~ ^[0-9a-f]{40}$ ]]
          test "$libbacktrace_ref" = HEAD
          cc_target="$(cc -dumpmachine)"
          cc_version="$(cc -dumpfullversion -dumpversion)"
          ar_version="$(ar --version | sed -n '1p')"
          ranlib_version="$(ranlib --version | sed -n '1p')"
          ld_version="$(ld --version | sed -n '1p')"
          make_version="$(make --version | sed -n '1p')"
          cmake_version="$(cmake --version | sed -n '1p')"
          perl_version="$(perl -V:version)"
          system_packages="$(dpkg-query -W -f='${Package}=${Version}\n' \
            libc6-dev libreadline-dev | LC_ALL=C sort)"
          for value in "$cc_target" "$cc_version" "$ar_version" \
            "$ranlib_version" "$ld_version" "$make_version" \
            "$cmake_version" "$perl_version" "$system_packages"; do
            test -n "$value"
          done
          inputs="$RUNNER_TEMP/titan-sanitizer-native-cache-inputs"
          lua_revision="$(git rev-parse HEAD:lua-5.5.1)"
          libuv_patch_sha256="$(sha256sum vendor/libuv/libuv-1.53.0-spawn-close.patch | cut -d' ' -f1)"
          {
            printf '%s\n' \
              "schema=$SANITIZER_NATIVE_CACHE_SCHEMA" \
              "titan_abi=$TITAN_ABI_VERSION" \
              "lua=$SANITIZER_LUA_VERSION" \
              "lua_revision=$lua_revision" \
              "libbacktrace=$libbacktrace_rev" \
              "libuv=$SANITIZER_LIBUV_VERSION:$SANITIZER_LIBUV_SHA256" \
              "libuv_patch=$libuv_patch_sha256" \
              "llhttp=$SANITIZER_LLHTTP_VERSION:$SANITIZER_LLHTTP_SHA256" \
              "sqlite3=$SANITIZER_SQLITE3_VERSION:$SANITIZER_SQLITE3_SHA256" \
              "openssl=$SANITIZER_OPENSSL_VERSION:$SANITIZER_OPENSSL_SHA256" \
              "lua_cflags=$LUA_MYCFLAGS" \
              "lua_ldflags=$LUA_MYLDFLAGS" \
              "lua_libs=$LUA_MYLIBS" \
              "libbacktrace_cflags=$LIBBT_CFLAGS" \
              "libuv_profile=$LIBUV_BUILD_PROFILE" \
              "libuv_type=$LIBUV_BUILD_TYPE" \
              "libuv_cflags=$LIBUV_BUILD_CFLAGS" \
              "rock_cflags=${ROCK_CFLAGS:--O0 -fno-lto -fPIC}" \
              "titan_cppflags=${TITAN_EXTRA_CPPFLAGS:-}" \
              "titan_cflags=$TITAN_EXTRA_CFLAGS" \
              "llhttp_cflags=$LLHTTP_BUILD_CFLAGS" \
              "sqlite3_cflags=$SQLITE3_BUILD_CFLAGS" \
              "openssl_cflags=$OPENSSL_BUILD_CFLAGS" \
              "openssl_configure=$OPENSSL_EXTRA_CONFIGURE_FLAGS" \
              "cc_command=${CC:-cc}" \
              "ar_command=${AR:-ar}" \
              "ranlib_command=${RANLIB:-ranlib}" \
              "cc_target=$cc_target" \
              "cc_version=$cc_version" \
              "ar_version=$ar_version" \
              "ranlib_version=$ranlib_version" \
              "ld_version=$ld_version" \
              "make_version=$make_version" \
              "cmake_version=$cmake_version" \
              "perl_version=$perl_version" \
              "system_packages=$system_packages"
          } > "$inputs"
          digest="$(sha256sum "$inputs" | cut -d' ' -f1)"
          [[ $digest =~ ^[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "SANITIZER_LIBBACKTRACE_REV=$libbacktrace_rev" >> "$GITHUB_ENV"
          cat "$inputs"

      - name: Restore sanitizer native dependencies
        id: sanitizer-native-cache
        uses: ubicloud/cache/restore@v4
        with:
          path: |
            .lua
            lua-${{ env.SANITIZER_LUA_VERSION }}
            libbacktrace
            libuv-v${{ env.SANITIZER_LIBUV_VERSION }}
            libuv-v${{ env.SANITIZER_LIBUV_VERSION }}.tar.gz
            libuv-build
            llhttp-release-v${{ env.SANITIZER_LLHTTP_VERSION }}
            llhttp-release-v${{ env.SANITIZER_LLHTTP_VERSION }}.tar.gz
            llhttp-build
            sqlite-autoconf-${{ env.SANITIZER_SQLITE3_RELEASE }}
            sqlite-autoconf-${{ env.SANITIZER_SQLITE3_RELEASE }}.tar.gz
            sqlite3-build
            openssl-${{ env.SANITIZER_OPENSSL_VERSION }}
            openssl-${{ env.SANITIZER_OPENSSL_VERSION }}.tar.gz
            openssl-build
          key: titan-sanitizer-native-${{ env.SANITIZER_NATIVE_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-${{ steps.sanitizer-native-cache-key.outputs.digest }}

      - name: Build sanitizer-enabled native dependencies
        run: |
          # Start the long OpenSSL and Lua builds first. The shared Make
          # jobserver keeps the complete independent native DAG within two
          # CPU slots while overlapping configuration, download, and compile
          # work on a cold cache miss.
          bash spec/support/ci_sanitizer_capture.sh native-dependencies \
            make openssl lua libuv libbacktrace llhttp sqlite3

      - name: Validate sanitizer native dependency boundary
        run: |
          test -x "$PREFIX/bin/lua"
          test -f "$PREFIX/lib/liblua.a"
          test "$(git -C libbacktrace rev-parse HEAD)" = \
            "$SANITIZER_LIBBACKTRACE_REV"
          test -f libbacktrace/.libs/libbacktrace.a
          test -f libbacktrace/.titan-build.config
          test -f libuv-build/libuv.a
          test -f libuv-build/.titan-build.config
          test -f llhttp-build/libtitan-llhttp.a
          test -f sqlite3-build/libtitan-sqlite3.a
          test -f openssl-build/libssl.a
          test -f openssl-build/libcrypto.a
          test ! -e "$PREFIX/bin/luarocks"
          # The Lua installation creates no lib/titan tree of its own, so a
          # clean sanitizer prefix has neither the directory nor a versioned
          # search directory beneath it. Only installed Titan artifacts belong
          # beyond this cache boundary, so any entry found here fails, including
          # a non-directory lib/titan.
          titan_entries=""
          if test -e "$PREFIX/lib/titan" || test -L "$PREFIX/lib/titan"; then
            titan_entries="$(find "$PREFIX/lib/titan" ! -type d -print -quit)"
          fi
          test -z "$titan_entries"
          test ! -e "$PREFIX/var/cache/titan-probes"

      - name: Save sanitizer native dependencies
        if: steps.sanitizer-native-cache.outputs.cache-hit != 'true'
        uses: ubicloud/cache/save@v4
        with:
          path: |
            .lua
            lua-${{ env.SANITIZER_LUA_VERSION }}
            libbacktrace
            libuv-v${{ env.SANITIZER_LIBUV_VERSION }}
            libuv-v${{ env.SANITIZER_LIBUV_VERSION }}.tar.gz
            libuv-build
            llhttp-release-v${{ env.SANITIZER_LLHTTP_VERSION }}
            llhttp-release-v${{ env.SANITIZER_LLHTTP_VERSION }}.tar.gz
            llhttp-build
            sqlite-autoconf-${{ env.SANITIZER_SQLITE3_RELEASE }}
            sqlite-autoconf-${{ env.SANITIZER_SQLITE3_RELEASE }}.tar.gz
            sqlite3-build
            openssl-${{ env.SANITIZER_OPENSSL_VERSION }}
            openssl-${{ env.SANITIZER_OPENSSL_VERSION }}.tar.gz
            openssl-build
          key: ${{ steps.sanitizer-native-cache.outputs.cache-primary-key }}

      - name: Install LuaRocks for the sanitizer Lua
        run: |
          bash spec/support/ci_sanitizer_capture.sh luarocks make luarocks
          bash spec/support/ci_sanitizer_capture.sh lpeglabel-install \
            "$PREFIX/bin/luarocks" build lpeglabel 1.6.2-1 \
            CFLAGS="$COMPILER_DEPS_CFLAGS" LDFLAGS="$COMPILER_DEPS_LDFLAGS"
          bash spec/support/ci_sanitizer_capture.sh filesystem-install \
            "$PREFIX/bin/luarocks" build luafilesystem \
            CFLAGS="$COMPILER_DEPS_CFLAGS" LDFLAGS="$COMPILER_DEPS_LDFLAGS"

      - name: Activate the sanitizer Titan prefix
        run: |
          # The install CLI accepts one exact version rather than a dependency
          # constraint; pin the current release inside the rockspec's range.
          bash spec/support/ci_sanitizer_capture.sh busted-install \
            "$PREFIX/bin/luarocks" install busted 2.3.0-1
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Restore sanitizer C-probe results
        uses: ubicloud/cache@v4
        with:
          path: .lua/var/cache/titan-probes/2
          key: titan-probes-2-${{ runner.os }}-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-sanitizer-${{ github.sha }}
          restore-keys: |
            titan-probes-2-${{ runner.os }}-${{ runner.arch }}-${{ env.TITAN_BUILD_PROFILE }}-sanitizer-

      - name: Build sanitizer-enabled Titan artifacts
        run: |
          bash spec/support/ci_sanitizer_capture.sh titan-artifacts \
            luarocks make --force
          provider="$PREFIX/lib/titan/0.6/titan.so"
          static_archive="${provider%.so}.a"
          runtime_archive="$PREFIX/lib/titan/0.6/libtitan.a"
          snapshot_provider="$TITAN_STDLIB_DIAGNOSTIC_SNAPSHOT/provider.so"
          test -f "$provider" && test ! -L "$provider"
          test -f "$static_archive" && test ! -L "$static_archive"
          test -f "$runtime_archive" && test ! -L "$runtime_archive"
          test ! -e "$PREFIX/lib/libtitan.a"
          test -d "$TITAN_STDLIB_DIAGNOSTIC_SNAPSHOT"
          test -f "$TITAN_STDLIB_DIAGNOSTIC_SNAPSHOT/manifest.txt"
          test -f "$snapshot_provider" && test ! -L "$snapshot_provider"
          cmp "$snapshot_provider" "$provider"
          test -f "$PREFIX/lib/lua/5.5/titan.so"
          test ! -e "$PREFIX/share/lua/5.5/titan"
          test ! -e "$PREFIX/share/titan/0.6/src/titan/test.titan"
          readelf -Ws .lua/bin/lua | grep __asan_
          readelf -Ws .lua/bin/lua | grep __ubsan_
          for module in lpeglabel lfs; do
            readelf -Ws "$PREFIX/lib/lua/5.5/$module.so" | grep __asan_
            readelf -Ws "$PREFIX/lib/lua/5.5/$module.so" | grep __ubsan_
          done
          readelf -Ws "$provider" | grep __asan_
          readelf -Ws "$provider" | grep __ubsan_

      # Every focused sanitizer gate filters the same complete aggregate.
      # Its identical-reinstall gate must reuse every certified build artifact.
      - name: Build unified native stdlib sanitizer executable
        env:
          TITAN_TEST_EXTRA_CFLAGS: ${{ env.SANITIZER_FLAGS }}
          TITAN_TEST_EXTRA_LDFLAGS: ${{ env.SANITIZER_FLAGS }}
        run: |
          bash spec/support/ci_sanitizer_capture.sh native-stdlib-build \
            make titan-stdlib-test-build

      - name: Certify identical SDK reinstall without sanitizer compilation or linking
        env:
          TITAN_TEST_EXTRA_CFLAGS: ${{ env.SANITIZER_FLAGS }}
          TITAN_TEST_EXTRA_LDFLAGS: ${{ env.SANITIZER_FLAGS }}
        run: |
          # The first install owns the immutable failure-diagnostic snapshot.
          # Only this identical reinstall skips taking a second snapshot.
          bash spec/support/ci_sanitizer_capture.sh identical-reinstall \
            env TITAN_STDLIB_DIAGNOSTIC_SNAPSHOT= luarocks make --force
          cmp "$TITAN_STDLIB_DIAGNOSTIC_SNAPSHOT/provider.so" \
            "$PREFIX/lib/titan/0.6/titan.so"
          log="$RUNNER_TEMP/titan-sanitizer-identical-reinstall.log"
          bash spec/support/ci_sanitizer_capture.sh native-stdlib-identical-reinstall \
            make titan-stdlib-test-build TITAN_VERBOSE=1 2>&1 | tee "$log"
          grep -Eq '^Titan object hit ' "$log"
          grep -Eq '^Titan native hit ' "$log"
          grep -Eq '^Titan link hit ' "$log"
          if grep -Eq '^Titan (object|native|link) miss |os_process_host_child[.]c' "$log"; then
            echo "Identical SDK reinstall compiled or linked native sanitizer artifacts" >&2
            exit 1
          fi

      # Check shutdown on the already built sanitizer aggregate. Coverage
      # reporting must not consume the lifetime oracle's 15-second budget.
      - name: Check native Runtime shutdown deadline
        run: |
          bash spec/support/ci_sanitizer_capture.sh runtime-shutdown \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_runtime_shutdown_closes_native_handles_but_not_files$' \
              TITAN_TEST_TIMEOUT=15

      - name: Run dense Array and value transfer sanitizer gate
        env:
          TITAN_TEST_EXTRA_CFLAGS: ${{ env.SANITIZER_FLAGS }}
          TITAN_TEST_EXTRA_LDFLAGS: ${{ env.SANITIZER_FLAGS }}
        run: |
          bash spec/support/ci_sanitizer_capture.sh dense-array \
            env TITAN_PROBE_CACHE_DISABLE=1 .lua/bin/busted -o gtest -v \
              spec/dense_array_runtime_spec.lua
          bash spec/support/ci_sanitizer_capture.sh value-transfer \
            make titan-stdlib-test-run TITAN_FILTER=transfer

      - name: Run immediate function compiler sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh immediate-functions \
            env TITAN_PROBE_CACHE_DISABLE=1 .lua/bin/busted -o gtest -v spec/coder/immediate_functions_spec.lua

      - name: Run native nominal storage sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh nominal-storage \
            env TITAN_PROBE_CACHE_DISABLE=1 .lua/bin/busted -o gtest -v \
              spec/coder/nominal_storage_spec.lua \
              spec/coder/native_optional_storage_spec.lua

      - name: Run native coroutine sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh coroutine-gc \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_lua_host_roots_coroutine_payloads_and_tags_across_gc$'

      # Implementation notes: doc/implementation/continuous-integration.md#fake-stack-probe
      - name: Check ASan fake-stack placement of setjmp frames
        run: |
          # GCC places a frame that calls setjmp on ASan's fake stack under
          # detect_stack_use_after_return=1; Clang never does. Only such a lane
          # exercises the coroutine crossing's fake-stack address normalization.
          # If a runner image or compiler change stopped that placement, the
          # test_unwind_ gate below would silently stop exercising it.
          probe="$RUNNER_TEMP/asan-fake-stack-probe"
          bash spec/support/ci_sanitizer_capture.sh asan-fake-stack-probe-build \
            "$CC" $SANITIZER_FLAGS spec/support/asan_fake_stack_probe.c -o "$probe"
          bash spec/support/ci_sanitizer_capture.sh asan-fake-stack-probe \
            "$probe"

      # The state-close teardown cases pass on a plain build; only ASan/LSan
      # diagnoses their leaks and misuse. The unwinding cases assert cleanup order
      # on every build; here they add memory-safety coverage of the crossings.
      - name: Run native teardown and unwinding sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh lua-close-teardown \
            make titan-stdlib-test-run TITAN_FILTER='test_lua_close_'
          bash spec/support/ci_sanitizer_capture.sh coroutine-unwind \
            make titan-stdlib-test-run TITAN_FILTER='test_unwind_'
          for teardown_log in lua-close-teardown coroutine-unwind; do
            if ! grep -Eq $'^\\[==========\\] [1-9][0-9]* tests? ran\\. \\([0-9]+\\.[0-9]{2} ms total\\)\r?$' \
                "$TITAN_SANITIZER_LOG_DIR/$teardown_log.log"; then
              echo "Teardown sanitizer filter ran no tests: $teardown_log" >&2
              exit 1
            fi
          done

      - name: Run native async sanitizer gate (timer-fs)
        run: |
          bash spec/support/ci_sanitizer_capture.sh timer-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_timer_'
          bash spec/support/ci_sanitizer_capture.sh fs-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_fs_'

      - name: Run native async sanitizer gate (core-uv)
        env:
          TITAN_TEST_EXTRA_CFLAGS: ${{ env.SANITIZER_FLAGS }}
          TITAN_TEST_EXTRA_LDFLAGS: ${{ env.SANITIZER_FLAGS }}
          MINICORO_TEST_CC: gcc
          MINICORO_TEST_CFLAGS: ${{ env.SANITIZER_FLAGS }}
        run: |
          bash spec/support/ci_sanitizer_capture.sh core-uv \
            env TITAN_PROBE_CACHE_DISABLE=1 .lua/bin/busted -o gtest -v spec/minicoro_spec.lua
          bash spec/support/ci_sanitizer_capture.sh uv-task-tests \
            make titan-stdlib-test-run TITAN_FILTER='^uv%.task_tests%.'
          bash spec/support/ci_sanitizer_capture.sh uv-runtime-tests \
            make titan-stdlib-test-run TITAN_FILTER='^uv%.runtime_tests%.'
          bash spec/support/ci_sanitizer_capture.sh async-completion-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_completion_'
          bash spec/support/ci_sanitizer_capture.sh async-ready-queue-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_ready_queue_'
          bash spec/support/ci_sanitizer_capture.sh async-wake-rollback-tests \
            make titan-stdlib-test-run TITAN_FILTER='wake_failure_'
          bash spec/support/ci_sanitizer_capture.sh uv-scalar-write-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_scalar_write_'
          bash spec/support/ci_sanitizer_capture.sh uv-concrete-data-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_concrete_'
          bash spec/support/ci_sanitizer_capture.sh net-owned-buffer-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_net_received_chunks_remain_immutable'
          bash spec/support/ci_sanitizer_capture.sh net-overlapping-write-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_net_overlapping_writes_'
          bash spec/support/ci_sanitizer_capture.sh foreign-work-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_run_foreign_'
          bash spec/support/ci_sanitizer_capture.sh independent-lua-state-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_lua_independent_'
          bash spec/support/ci_sanitizer_capture.sh async-receiver-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_receiver_'
          bash spec/support/ci_sanitizer_capture.sh signal-owner-tests \
            make titan-stdlib-test-run TITAN_FILTER='test_signal_watcher_'

      - name: Run native TLS/HTTP sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh ssl-http \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_ssl_http_fresh_process_sanitizer_composition$'
          bash spec/support/ci_sanitizer_capture.sh ssl-duplex \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_ssl_simultaneous_large_duplex_preserves_bytes$'
          bash spec/support/ci_sanitizer_capture.sh ssl-backpressure \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_ssl_cancel_backpressured_write_aborts_before_native_drain$'
          bash spec/support/ci_sanitizer_capture.sh ssl-drain-failure \
            make titan-stdlib-test-run \
              TITAN_FILTER='^ssl[.]tests[.]test_ssl_drain_preserves_write_shutdown_failure$'
          bash spec/support/ci_sanitizer_capture.sh http-upgrade-handoff \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_upgrade_server_transfers_binary_excess_and_handler_lifetime$'
          bash spec/support/ci_sanitizer_capture.sh http-upgrade-abort \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_upgrade_opening_cancellation_aborts_before_output_drain$'
          for ownership_log in ssl-duplex ssl-backpressure ssl-drain-failure \
              http-upgrade-handoff http-upgrade-abort; do
            if ! grep -Eq $'^\\[==========\\] [1-9][0-9]* tests? ran\\. \\([0-9]+\\.[0-9]{2} ms total\\)\r?$' \
                "$TITAN_SANITIZER_LOG_DIR/$ownership_log.log"; then
              echo "TLS/HTTP ownership sanitizer filter ran no tests: $ownership_log" >&2
              exit 1
            fi
          done

      - name: Run native WebSocket ownership sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh websocket-message-gc \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_received_message_strings_survive_later_reads_and_forced_gc$'
          bash spec/support/ci_sanitizer_capture.sh websocket-partial-utf8 \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_partial_utf8_message_cancellation_retires_ownership'
          bash spec/support/ci_sanitizer_capture.sh websocket-read-cancel \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_admitted_idle_read_cancellation_terminalizes_ws_and_wss'
          bash spec/support/ci_sanitizer_capture.sh websocket-active-close \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_close_interrupts_active_read_without_joining_its_caller$'
          bash spec/support/ci_sanitizer_capture.sh websocket-receive-progress \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_shutdown_takes_receive_progress_after_reader_returns_data'
          bash spec/support/ci_sanitizer_capture.sh websocket-backpressure \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_stopped_socket_output_aborts_before_native_drain'
          for ownership_log in websocket-message-gc websocket-partial-utf8 \
              websocket-read-cancel websocket-active-close \
              websocket-receive-progress websocket-backpressure; do
            if ! grep -Eq $'^\\[==========\\] [1-9][0-9]* tests? ran\\. \\([0-9]+\\.[0-9]{2} ms total\\)\r?$' \
                "$TITAN_SANITIZER_LOG_DIR/$ownership_log.log"; then
              echo "WebSocket ownership sanitizer filter ran no tests: $ownership_log" >&2
              exit 1
            fi
          done

      - name: Run native SQLite sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh sqlite3-tests \
            make titan-stdlib-test-run TITAN_FILTER='^sqlite3%.tests%.'

      - name: Run native JSON sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh json-mapping-gc \
            make titan-stdlib-test-run TITAN_FILTER='^json%.tests%.test_mapping_allocated_constructor_arguments_survive_collection'
          bash spec/support/ci_sanitizer_capture.sh json-wide-folds \
            make titan-stdlib-test-run TITAN_FILTER='^json%.tests%.test_parser_wide_fold_collections'
          bash spec/support/ci_sanitizer_capture.sh json-nesting \
            make titan-stdlib-test-run TITAN_FILTER='^json%.tests%.test_parser_configured_nesting_boundary'
          bash spec/support/ci_sanitizer_capture.sh json-nesting-mixed \
            make titan-stdlib-test-run TITAN_FILTER='^json%.tests%.test_parser_deep_mixed_containers_and_sibling_members'
          bash spec/support/ci_sanitizer_capture.sh json-nesting-peg-limit \
            make titan-stdlib-test-run TITAN_FILTER='^json%.tests%.test_parser_peg_limit_is_independent_of_depth_option'
          bash spec/support/ci_sanitizer_capture.sh json-numbers \
            make titan-stdlib-test-run TITAN_FILTER='^json%.tests%.test_core_float_range_tags_and_round_trips'
          bash spec/support/ci_sanitizer_capture.sh json-native-storage \
            make titan-stdlib-test-run TITAN_FILTER='^json%.tests%.test_mapping_.*native_numbers'
          for nesting_log in json-nesting json-nesting-mixed json-nesting-peg-limit; do
            if ! grep -Eq $'^\\[==========\\] [1-9][0-9]* tests? ran\\. \\([0-9]+\\.[0-9]{2} ms total\\)\r?$' \
                "$TITAN_SANITIZER_LOG_DIR/$nesting_log.log"; then
              echo "JSON nesting sanitizer filter ran no tests: $nesting_log" >&2
              exit 1
            fi
          done

      - name: Run native reflection sanitizer gate
        run: |
          bash spec/support/ci_sanitizer_capture.sh reflect-tests \
            make titan-stdlib-test-run TITAN_FILTER='^reflect%.tests%.'

      - name: Run PEG/regex native sanitizer gate
        env:
          TITAN_TEST_EXTRA_CFLAGS: ${{ env.SANITIZER_FLAGS }}
          TITAN_TEST_EXTRA_LDFLAGS: ${{ env.SANITIZER_FLAGS }}
        run: |
          bash spec/support/ci_sanitizer_capture.sh peg-gc \
            make titan-stdlib-test-run \
              TITAN_FILTER='test_peg_roots_and_releases_titan_callback_patterns$'
          bash spec/support/ci_sanitizer_capture.sh string-regex-gc \
            make titan-stdlib-test-run TITAN_FILTER='test_regex_gc_rooting$'
          bash spec/support/ci_sanitizer_capture.sh peg-string-smoke \
            bash spec/support/ci_peg_string_sanitizer_smoke.sh

      - name: Build sanitizer child-process smoke fixture
        env:
          TITAN_TEST_EXTRA_CFLAGS: ${{ env.SANITIZER_FLAGS }}
          TITAN_TEST_EXTRA_LDFLAGS: ${{ env.SANITIZER_FLAGS }}
        run: |
          process_smoke_dir="$RUNNER_TEMP/titan-sanitizer-process-smoke"
          mkdir -p "$process_smoke_dir"
          bash spec/support/ci_sanitizer_capture.sh process-smoke-build \
            env TITAN_PROCESS_SMOKE_DIR="$process_smoke_dir" \
            .lua/bin/lua -e 'require("spec.support.os_test_support").process_child(assert(os.getenv("TITAN_PROCESS_SMOKE_DIR")))'
          echo "TITAN_PROCESS_SMOKE_CHILD=$process_smoke_dir/process_child" >> "$GITHUB_ENV"

      # Plain Lua hosts load the support module and the stdlib provider from
      # the interpreter's default lib/lua/5.5 and lib/titan/0.6 roots.
      - name: Run sanitized net/OS production smokes
        run: |
          bash spec/support/ci_sanitizer_capture.sh net-production-smoke \
            env -u LUA_PATH -u LUA_CPATH -u LUA_PATH_5_5 -u LUA_CPATH_5_5 \
            -u TITAN_PATH -u TITAN_PATH_0_6 -u TITAN_ROOT \
            .lua/bin/lua spec/fixtures/libuv/net_production_smoke.lua \
              sanitizer
          bash spec/support/ci_sanitizer_capture.sh os-production-smoke \
            env -u LUA_PATH -u LUA_CPATH -u LUA_PATH_5_5 -u LUA_CPATH_5_5 \
            -u TITAN_PATH -u TITAN_PATH_0_6 -u TITAN_ROOT \
            .lua/bin/lua spec/fixtures/libuv/os_production_smoke.lua \
              sanitizer "$TITAN_PROCESS_SMOKE_CHILD"

      # Implementation notes: doc/implementation/continuous-integration.md#sanitizer-ownership-and-failure-diagnostics
      - name: Report generated C context for sanitizer failure
        if: ${{ failure() && !cancelled() }}
        continue-on-error: true
        run: |
          "$PREFIX/bin/lua" -E \
            spec/support/ci_asan_generated_c_context.lua report \
            "$TITAN_SANITIZER_LOG_DIR" \
            "$TITAN_STDLIB_DIAGNOSTIC_SNAPSHOT"
