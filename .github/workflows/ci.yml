name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lua_os: linux
          - os: macos-latest
            lua_os: macosx

    runs-on: ${{ matrix.os }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      INSTALL_LUA: "lua=5.5"
      LUA: lua

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache lua_install and LuaRocks
        uses: actions/cache@v5
        with:
          path: |
            lua_install
            ~/.luarocks
          key: ${{ runner.os }}-lua-${{ hashFiles('titan-dev-1.rockspec') }}
          restore-keys: |
            ${{ runner.os }}-lua-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Install hererocks and set up Lua 5.5
        run: |
          if [ ! -f lua_install/bin/luarocks ]; then
            # PyPI hererocks (0.25.1) only knows Lua up to 5.4; 5.5 support
            # is only in git master
            pip install git+https://github.com/luarocks/hererocks
            hererocks lua_install -r^ --$INSTALL_LUA
          fi

      - name: Set environment variables
        run: |
          echo "$PWD/lua_install/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=./?.lua;$PWD/lua_install/share/lua/5.5/?.lua" >> "$GITHUB_ENV"
          echo "LUA_CPATH=./?.so;$PWD/lua_install/lib/lua/5.5/?.so" >> "$GITHUB_ENV"

      - name: Download and build Lua 5.5 source
        run: |
          wget http://www.lua.org/ftp/lua-5.5.0.tar.gz
          tar zxvf lua-5.5.0.tar.gz
          cd lua-5.5.0 && make ${{ matrix.lua_os }} MYCFLAGS=-fPIC

      - name: Install test dependencies
        run: |
          if [ ! -f lua_install/bin/busted ]; then luarocks install busted; fi
          if [ ! -f lua_install/bin/luacov ]; then luarocks install cluacov; fi
          luarocks make

      - name: Print Lua version
        run: lua -v

      - name: Run tests
        run: busted -c -o gtest -v spec/

      - name: Generate coverage report
        if: success()
        run: |
          luacov "titan%-compiler" "/spec/[^/]+.lua" "titanc"
          grep "Summary" -B1 -A1000 luacov.report.out

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
