name: CI

on:
  push:
    # "*" matches only top-level branch names; "**" also matches names with
    # slashes (e.g. "tooling/foo"), so every pushed branch triggers CI.
    branches: ["**"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lua_os: linux
          - os: macos-latest
            lua_os: macosx

    runs-on: ${{ matrix.os }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      INSTALL_LUA: "lua=5.5"
      LUA: lua

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache lua_install and LuaRocks
        uses: actions/cache@v5
        with:
          path: |
            lua_install
            ~/.luarocks
          key: ${{ runner.os }}-lua-${{ hashFiles('titan-dev-1.rockspec') }}
          restore-keys: |
            ${{ runner.os }}-lua-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev

      - name: Install hererocks and set up Lua 5.5
        run: |
          if [ ! -f lua_install/bin/luarocks ]; then
            # PyPI hererocks (0.25.1) only knows Lua up to 5.4; 5.5 support
            # is only in git master
            pip install git+https://github.com/luarocks/hererocks
            hererocks lua_install -r^ --$INSTALL_LUA
          fi

      - name: Set environment variables
        run: |
          echo "$PWD/lua_install/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=./?.lua;$PWD/lua_install/share/lua/5.5/?.lua" >> "$GITHUB_ENV"
          echo "LUA_CPATH=./?.so;$PWD/lua_install/lib/lua/5.5/?.so" >> "$GITHUB_ENV"

      - name: Build the bundled Lua 5.5 source tree
        run: make lua LUA_PLATFORM=${{ matrix.lua_os }}

      # The runtime (titan.o) and every generated module/executable link
      # ./libbacktrace/.libs/libbacktrace.a (unified stack traces). CI runs
      # luarocks directly rather than `make test`, so build the tree explicitly,
      # mirroring `make lua` above.
      - name: Build the bundled libbacktrace
        run: make libbacktrace

      # Build and install the rock so the `titan` C runtime module (titanlib.c,
      # required by one coder spec via `require 'titan'`) is on the Lua path.
      # `luarocks test` does not build the rock-under-test, only its dependencies.
      - name: Build and install the rock
        run: luarocks make

      - name: Print Lua version
        run: lua -v

      # `luarocks test` installs the test_dependencies (busted, cluacov) declared
      # in the rockspec and runs the suite; flags after `--` are forwarded to busted.
      - name: Run tests
        run: luarocks test -- -c -o gtest -v

      - name: Generate coverage report
        if: success()
        run: |
          luacov "titan%-compiler" "/spec/[^/]+.lua" "titanc"
          grep "Summary" -B1 -A1000 luacov.report.out

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
