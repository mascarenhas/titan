# See https://docs.codecov.io/docs/codecov-yaml

# The LuaCov upload copy uses a .lua heading so Codecov recognizes the CLI
# section. Restore the real tracked filename after report parsing.
fixes:
  - "^titanc[.]lua$::titanc"

comment:
  layout: "files, footer"
  behavior: default
  require_changes: yes # Require coverage change to post comment
  require_base: no
  require_head: yes

coverage:
  status:
    patch:
      default:
        target: 90
        flags: [compiler]
    project:
      default:
        target: 90
        flags: [compiler]

flags:
  compiler:
    paths:
      - titan-compiler/
      - titanc
  native-stdlib:
    paths:
      - titan/
# Native coverage starts with an honest baseline. Existing compiler thresholds
# remain scoped to the compiler; no arbitrary initial native threshold is added.

ignore:
  - "spec"
