# See https://docs.codecov.io/docs/codecov-yaml

# The LuaCov upload copy uses a .lua heading so Codecov recognizes the CLI
# section. Restore the real tracked filename after report parsing.
fixes:
  - "^titanc[.]lua$::titanc"

comment:
  layout: "files, footer"
  behavior: default
  require_changes: yes # Require coverage change to post comment
  require_base: no
  require_head: yes

coverage:
  status:
    patch:
      default:
        target: 90
    project:
      default:
        target: 90

ignore:
  - "spec"
